<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruit Rabbit Malrangi Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: #090a0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Mobile Phone Container */
        .phone-container {
            width: 412px;
            height: 816px;
            background: radial-gradient(circle at 50% 30%, #2a1b3d 0%, #0d0914 100%);
            border-radius: 44px;
            border: 10px solid #1a1528;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
        }

        /* Top Notch */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 26px;
            background: #1a1528;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 100;
        }

        /* Top Navigation Overlay */
        .top-nav {
            position: absolute;
            top: 36px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        .top-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }

        .top-btn:active {
            transform: scale(0.9);
        }

        .title-badge {
            background: rgba(255, 71, 87, 0.25);
            border: 1.5px solid #ff4757;
            color: #ff6b81;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.3);
        }

        /* Feel Selector Pills */
        .feel-selector {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 50;
            background: rgba(15, 12, 25, 0.7);
            padding: 6px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
        }

        .feel-pill {
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 0.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: transparent;
            border: none;
        }

        .feel-pill.active {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transform: scale(1.05);
        }

        /* Interactive 3D Canvas Stage */
        .canvas-stage {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* Splash Screen Overlay */
        .splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0a1c 0%, #1e1333 50%, #2b1742 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 30px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-title-img {
            max-width: 320px;
            width: 85%;
            height: auto;
            margin-bottom: 50px;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.6));
            animation: floatLogo 3.5s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        .start-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #ffffff;
            border: none;
            border-radius: 28px;
            padding: 16px 52px;
            font-size: 1.35rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.5), 0 0 0 4px rgba(255, 71, 87, 0.25);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulseBtn 2s infinite;
        }

        .start-btn:hover, .start-btn:active {
            transform: scale(1.08);
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            box-shadow: 0 14px 36px rgba(255, 71, 87, 0.65), 0 0 0 6px rgba(255, 71, 87, 0.35);
        }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .copyright-text {
            position: absolute;
            bottom: 24px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 600;
        }

        /* Bottom Hint Text */
        .bottom-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="notch"></div>

        <!-- Top Navigation -->
        <div class="top-nav">
            <div class="top-btn" id="home-btn" title="처음으로">🏠</div>
            <div class="title-badge">딸기 토끼 말랑이</div>
            <div class="top-btn" id="reset-btn" title="복원">🔄</div>
        </div>

        <!-- Feel Selector Pills -->
        <div class="feel-selector">
            <button class="feel-pill active" data-feel="soft">말랑말랑</button>
            <button class="feel-pill" data-feel="jelly">젤리젤리</button>
            <button class="feel-pill" data-feel="chewy">쫀득쫀득</button>
            <button class="feel-pill" data-feel="fluffy">퐁신퐁신</button>
        </div>

        <!-- Interactive 3D Canvas -->
        <div class="canvas-stage">
            <canvas id="malrangi-canvas"></canvas>
        </div>

        <!-- Bottom Touch Hint -->
        <div class="bottom-hint">👉 손가락으로 주물주물 만져보세요!</div>

        <!-- Start Splash Screen -->
        <div class="splash-screen" id="splash-screen">
            <img src="logo.png" alt="Fruit Rabbit Malrangi" class="splash-title-img" onerror="this.onerror=null; this.src='1.png';">
            <button class="start-btn" id="start-game-btn">게임 시작</button>
            <div class="copyright-text">© 2026 Fruitrabbit Malrangi Studio</div>
        </div>
    </div>

    <script>
        // --- 1. DOM & Global State ---
        const canvas = document.getElementById('malrangi-canvas');
        const ctx = canvas.getContext('2d');
        const splashScreen = document.getElementById('splash-screen');
        const startGameBtn = document.getElementById('start-game-btn');
        const homeBtn = document.getElementById('home-btn');
        const resetBtn = document.getElementById('reset-btn');
        const feelPills = document.querySelectorAll('.feel-pill');

        let width = 392;
        let height = 796;
        let dpr = window.devicePixelRatio || 1;

        // Texture image
        const jellyImage = new Image();
        jellyImage.src = '1.png';
        let textureLoaded = false;

        jellyImage.onload = () => {
            textureLoaded = true;
        };

        // Fallback for image load check
        if (jellyImage.complete && jellyImage.naturalWidth > 0) {
            textureLoaded = true;
        }

        // Physics Mesh Parameters
        const COLS = 6;
        const ROWS = 6;
        let points = [];
        let springs = [];
        let stiffness = 0.12;
        let damping = 0.88;

        // Dragging & Interaction State
        let isDragging = false;
        let draggedPoint = null;
        let pointerPos = { x: 0, y: 0 };

        // Floating Background Fruits
        const floatingFruits = [];
        const fruitEmojis = ['🍓', '🍋', '🍇', '🍊', '🍒', '✨'];

        for (let i = 0; i < 12; i++) {
            floatingFruits.push({
                x: Math.random() * 380,
                y: Math.random() * 700,
                size: 16 + Math.random() * 14,
                speedY: 0.3 + Math.random() * 0.5,
                emoji: fruitEmojis[i % fruitEmojis.length],
                rot: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.02
            });
        }

        // --- 2. Canvas Resizing ---
        function initCanvasSize() {
            const rect = canvas.parentElement.getBoundingClientRect();
            width = rect.width || 392;
            height = rect.height || 796;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            initMesh();
        }

        // --- 3. Physics Mesh Setup ---
        function initMesh() {
            points = [];
            springs = [];

            // Fit bunny cleanly in center without ear/foot clipping
            const bunnyWidth = width * 0.76;
            const bunnyHeight = bunnyWidth * 1.05;
            const startX = (width - bunnyWidth) / 2;
            const startY = (height - bunnyHeight) / 2 - 10; // Shift upward cleanly

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const u = c / (COLS - 1);
                    const v = r / (ROWS - 1);
                    const px = startX + u * bunnyWidth;
                    const py = startY + v * bunnyHeight;

                    points.push({
                        x: px,
                        y: py,
                        ox: px,
                        oy: py,
                        vx: 0,
                        vy: 0,
                        u: u,
                        v: v,
                        isPinned: (r === 0 && (c === 0 || c === COLS - 1)) || (r === ROWS - 1 && (c === 0 || c === COLS - 1)) ? false : false
                    });
                }
            }

            // Connect structural & diagonal springs
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const i = r * COLS + c;

                    if (c < COLS - 1) { // Right neighbor
                        addSpring(points[i], points[i + 1]);
                    }
                    if (r < ROWS - 1) { // Bottom neighbor
                        addSpring(points[i], points[i + COLS]);
                    }
                    if (c < COLS - 1 && r < ROWS - 1) { // Diagonal right-down
                        addSpring(points[i], points[i + COLS + 1]);
                    }
                    if (c > 0 && r < ROWS - 1) { // Diagonal left-down
                        addSpring(points[i], points[i + COLS - 1]);
                    }
                }
            }
        }

        function addSpring(p1, p2) {
            const dx = p1.ox - p2.ox;
            const dy = p1.oy - p2.oy;
            const length = Math.sqrt(dx * dx + dy * dy);
            springs.push({ p1, p2, length });
        }

        // --- 4. Physics Engine Step ---
        function updatePhysics() {
            // Spring forces
            for (let s of springs) {
                const dx = s.p2.x - s.p1.x;
                const dy = s.p2.y - s.p1.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
                const delta = dist - s.length;
                const fx = (dx / dist) * delta * stiffness;
                const fy = (dy / dist) * delta * stiffness;

                s.p1.vx += fx;
                s.p1.vy += fy;
                s.p2.vx -= fx;
                s.p2.vy -= fy;
            }

            // Position & Velocity update
            for (let p of points) {
                // Restoring force to origin
                const rx = (p.ox - p.x) * (stiffness * 0.4);
                const ry = (p.oy - p.y) * (stiffness * 0.4);

                p.vx = (p.vx + rx) * damping;
                p.vy = (p.vy + ry) * damping;

                p.x += p.vx;
                p.y += p.vy;
            }

            // Dragged point follow mouse/touch
            if (isDragging && draggedPoint) {
                draggedPoint.x = pointerPos.x;
                draggedPoint.y = pointerPos.y;
                draggedPoint.vx = 0;
                draggedPoint.vy = 0;
            }

            // Floating fruits update
            for (let f of floatingFruits) {
                f.y -= f.speedY;
                f.rot += f.rotSpeed;
                if (f.y < -30) {
                    f.y = height + 30;
                    f.x = Math.random() * width;
                }
            }
        }

        // --- 5. Render Engine ---
        function drawWarpedTriangle(p0, p1, p2) {
            if (!textureLoaded || !jellyImage.naturalWidth) {
                // Fallback colored mesh fill
                ctx.fillStyle = '#ff6b81';
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.lineTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.closePath();
                ctx.fill();
                return;
            }

            const iw = jellyImage.naturalWidth;
            const ih = jellyImage.naturalHeight;

            const u0 = p0.u * iw, v0 = p0.v * ih;
            const u1 = p1.u * iw, v1 = p1.v * ih;
            const u2 = p2.u * iw, v2 = p2.v * ih;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.closePath();
            ctx.clip();

            const delta = u0 * (v1 - v2) - v0 * (u1 - u2) + (u1 * v2 - u2 * v1);
            if (Math.abs(delta) < 0.0001) {
                ctx.restore();
                return;
            }

            const a = (p0.x * (v1 - v2) - v0 * (p1.x - p2.x) + (p1.x * v2 - p2.x * v1)) / delta;
            const b = (u0 * (p1.x - p2.x) - p0.x * (u1 - u2) + (u1 * p2.x - u2 * p1.x)) / delta;
            const c = (p0.y * (v1 - v2) - v0 * (p1.y - p2.y) + (p1.y * v2 - p2.y * v1)) / delta;
            const d = (u0 * (p1.y - p2.y) - p0.y * (u1 - u2) + (u1 * p2.y - u2 * p1.y)) / delta;
            const e = (p0.x * (u1 * v2 - u2 * v1) - u0 * (p1.x * v2 - p2.x * v1) + v0 * (p1.x * u2 - p2.x * u1)) / delta;
            const f = (p0.y * (u1 * v2 - u2 * v1) - u0 * (p1.y * v2 - p2.y * v1) + v0 * (p1.y * u2 - p2.y * u1)) / delta;

            ctx.transform(a, c, b, d, e, f);
            ctx.drawImage(jellyImage, 0, 0);
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // 1. Render Floating Background Fruits
            for (let f of floatingFruits) {
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate(f.rot);
                ctx.font = `${f.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = 0.35;
                ctx.fillText(f.emoji, 0, 0);
                ctx.restore();
            }

            // 2. Render Mesh Triangles
            for (let r = 0; r < ROWS - 1; r++) {
                for (let c = 0; c < COLS - 1; c++) {
                    const topL = points[r * COLS + c];
                    const topR = points[r * COLS + c + 1];
                    const botL = points[(r + 1) * COLS + c];
                    const botR = points[(r + 1) * COLS + c + 1];

                    drawWarpedTriangle(topL, topR, botL);
                    drawWarpedTriangle(topR, botR, botL);
                }
            }

            // 3. Subtle Touch Glow Effect
            if (isDragging && pointerPos) {
                ctx.save();
                const grad = ctx.createRadialGradient(pointerPos.x, pointerPos.y, 0, pointerPos.x, pointerPos.y, 45);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
                grad.addColorStop(1, 'rgba(255, 71, 87, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(pointerPos.x, pointerPos.y, 45, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function renderLoop() {
            updatePhysics();
            draw();
            requestAnimationFrame(renderLoop);
        }

        // --- 6. Touch & Mouse Interaction ---
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handlePointerDown(e) {
            const pos = getPointerPos(e);
            pointerPos = pos;

            // Find closest mesh point
            let closest = null;
            let minDist = 80; // Grab radius

            for (let p of points) {
                const dx = p.x - pos.x;
                const dy = p.y - pos.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) {
                    minDist = dist;
                    closest = p;
                }
            }

            if (closest) {
                isDragging = true;
                draggedPoint = closest;
            }
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            pointerPos = getPointerPos(e);
        }

        function handlePointerUp() {
            isDragging = false;
            draggedPoint = null;
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', (e) => {
            handlePointerDown(e);
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            handlePointerMove(e);
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', handlePointerUp);

        // --- 7. Feel Selector Pills ---
        const feelSettings = {
            soft: { stiffness: 0.12, damping: 0.88 },
            jelly: { stiffness: 0.22, damping: 0.82 },
            chewy: { stiffness: 0.35, damping: 0.75 },
            fluffy: { stiffness: 0.08, damping: 0.94 }
        };

        feelPills.forEach(pill => {
            pill.addEventListener('click', () => {
                feelPills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');

                const feel = pill.dataset.feel;
                if (feelSettings[feel]) {
                    stiffness = feelSettings[feel].stiffness;
                    damping = feelSettings[feel].damping;
                }
            });
        });

        // --- 8. UI Buttons & Splash Navigation ---
        startGameBtn.addEventListener('click', () => {
            splashScreen.classList.add('hidden');
        });

        homeBtn.addEventListener('click', () => {
            splashScreen.classList.remove('hidden');
        });

        resetBtn.addEventListener('click', () => {
            initMesh();
        });

        // --- 9. Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            initCanvasSize();
            requestAnimationFrame(renderLoop);
        });

        window.addEventListener('resize', initCanvasSize);
    </script>
</body>
</html>

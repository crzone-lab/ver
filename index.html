<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FruitRabbit Squishy Mobile Studio</title>
    <!-- Google Font: Outfit & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #07080a;
            --phone-border: #1a1e24;
            --accent-glow: rgba(255, 71, 87, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #a4b0be;
            --active-color: #ff4757;
            --glass-bg: rgba(26, 30, 36, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glow-cyan: #00d2ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1b2029 0%, #07080a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 2. Phone Simulator (Viewport) Centered */
        .phone-frame {
            width: 412px;
            height: 840px;
            background: #000;
            border-radius: 48px;
            border: 12px solid var(--phone-border);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }

        /* Notch representation */
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 28px;
            background: var(--phone-border);
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-notch::before {
            content: '';
            width: 50px;
            height: 4px;
            background: #0d0f12;
            border-radius: 2px;
        }

        /* Full Screen Interactive Canvas Area */
        .stage-area {
            flex: 1;
            position: relative;
            background: linear-gradient(180deg, #ff4757 0%, #ff6b81 100%);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Minimal Top Bar UI Overlay */
        .top-overlay-ui {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1010; /* Float above both lobby and playground screen stages */
        }

        .action-circle-btn {
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: none;
            transition: all 0.2s ease;
            box-shadow: none;
        }

        .action-circle-btn:hover {
            transform: scale(1.12);
        }

        .action-circle-btn img {
            width: 28px !important;
            height: 28px !important;
            object-fit: contain;
        }

        /* Game Start Splash Screen Style */
        .start-splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #090712 0%, #120e24 50%, #1c1535 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2500; /* Float over everything */
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s;
            padding: 24px;
            box-sizing: border-box;
        }

        .start-splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.55));
        }

        .start-logo-img {
            width: 100%;
            max-width: 320px;
            height: auto;
            object-fit: contain;
            animation: floatLogo 4s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .start-game-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            border-radius: 24px;
            padding: 16px 48px;
            font-size: 1.35rem;
            font-weight: 800;
            box-shadow: 0 8px 24px rgba(255, 71, 87, 0.45), 0 0 0 4px rgba(255, 71, 87, 0.2);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulseBtn 2s infinite;
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        .start-game-btn:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            box-shadow: 0 10px 28px rgba(255, 71, 87, 0.55), 0 0 0 6px rgba(255, 71, 87, 0.3);
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .start-footer-text {
            position: absolute;
            bottom: 24px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .recording-pill {
            background: rgba(255, 71, 87, 0.25);
            border: 1.5px solid var(--active-color);
            color: #ff4757;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse 1.5s infinite;
        }

        .blinking-dot {
            width: 8px;
            height: 8px;
            background: #ff4757;
            border-radius: 50%;
            display: inline-block;
            animation: blink-dot 0.8s infinite alternate;
        }

        @keyframes blink-dot {
            from { opacity: 0.3; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        /* Bottom Floating Drawer Sheet */
        .bottom-drawer {
            position: absolute;
            bottom: 24px;
            left: 16px;
            right: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 20px;
            backdrop-filter: blur(25px);
            z-index: 20;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.3s ease;
        }

        .drawer-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .row-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        /* Horizontal Scroll Trays */
        .scroll-tray {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none; /* Hide scrollbar for clean UI */
        }

        .scroll-tray::-webkit-scrollbar {
            display: none;
        }

        .tray-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .tray-item:hover {
            background: rgba(255, 71, 87, 0.1);
            border-color: rgba(255, 71, 87, 0.3);
        }

        .tray-item.active {
            background: var(--active-color);
            border-color: var(--active-color);
            color: #fff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .tray-emoji {
            font-size: 1.4rem;
        }

        /* Advanced Options Overlay */
        .advanced-settings-drawer {
            position: absolute;
            top: 155px;
            left: 16px;
            right: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(25px);
            z-index: 1050;
            display: none;
            flex-direction: column;
            gap: 12px;
            font-size: 0.8rem;
        }

        .advanced-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="range"] {
            width: 140px;
            accent-color: var(--active-color);
        }

        /* Pop-up Modals CSS styling */
        .pop-overlay {
            position: absolute;
            bottom: 24px;
            left: 20px;
            right: 20px;
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
            border-radius: 28px;
            padding: 20px;
            backdrop-filter: blur(25px);
            z-index: 50;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: slideUp 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94);
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .pop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-pop-btn {
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px 8px;
            transition: color 0.2s;
        }
        .close-pop-btn:hover {
            color: var(--active-color);
        }

        .pop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .grid-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .grid-card:hover {
            background: rgba(255, 71, 87, 0.08);
            border-color: rgba(255, 71, 87, 0.2);
        }

        .grid-card.active {
            background: rgba(255, 71, 87, 0.15);
            border-color: var(--active-color);
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.2);
        }

        .card-thumb {
            width: 54px;
            height: 54px;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            background-color: rgba(255,255,255,0.05);
        }

        .card-thumb-emoji {
            font-size: 2.2rem;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
        }

        /* 3. Screen Record Toast */
        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-weight: 800;
            color: #fff;
            z-index: 90;
        }

        /* Share / Result modal */
        .result-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            z-index: 110;
        }

        .preview-box {
            width: 100%;
            aspect-ratio: 9/16;
            background: #111;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            position: relative;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .modal-btn {
            flex: 1;
            background: var(--active-color);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-btn.secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* General layout guidance outside phone */
        .studio-background-info {
            position: absolute;
            left: 40px;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .studio-background-info h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 18px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .info-card b {
            color: #fff;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Dynamic Toast Notification */
        .toast-notification {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            backdrop-filter: blur(15px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .toast-notification.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Lobby Screen Layout Styles */
        .lobby-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #151329 0%, #290a36 50%, #0d0f1a 100%);
            display: flex;
            flex-direction: column;
            padding: 160px 24px 24px 24px; /* Space for global overlays */
            box-sizing: border-box;
            z-index: 1000; /* Over canvas playground */
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lobby-top-bar {
            display: none; /* Removed as we are using global top menu */
        }

        .lobby-feel-selector {
            position: absolute;
            top: 96px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            z-index: 1010; /* On top of lobby screen */
        }

        .feel-pill {
            flex: 1;
            padding: 10px 0;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #pill-jelly {
            background: #7d1c24 !important;
            color: rgba(255, 255, 255, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
        }
        #pill-mochi {
            background: #804a18 !important;
            color: rgba(255, 255, 255, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
        }
        #pill-slime {
            background: #085440 !important;
            color: rgba(255, 255, 255, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        #pill-jelly.active {
            background: #ff4757 !important;
            color: #fff !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.45);
        }

        #pill-mochi.active {
            background: #ff9f43 !important;
            color: #fff !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 4px 15px rgba(255, 159, 67, 0.45);
        }

        #pill-slime.active {
            background: #10ac84 !important;
            color: #fff !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 4px 15px rgba(16, 172, 132, 0.45);
        }

        .lobby-grid-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .lobby-grid-container::-webkit-scrollbar {
            display: none;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            justify-items: center;
            align-content: start;
            margin-bottom: 30px;
        }

        .grid-char-bubble {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.05) 55%, rgba(0,0,0,0.2) 100%);
            border: 1.5px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .grid-char-bubble::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 14px;
            height: 8px;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            transform: rotate(-15deg);
        }

        .grid-char-bubble.active {
            border-color: var(--active-color);
            box-shadow: 0 0 15px rgba(255, 77, 87, 0.5);
            background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.3) 0%, rgba(255, 77, 87, 0.15) 50%, rgba(255, 77, 87, 0.3) 100%);
        }

        .grid-char-bubble:hover {
            transform: scale(1.12);
            border-color: rgba(255,255,255,0.25);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .grid-char-bubble:active {
            transform: scale(0.95);
        }

        .bottom-option-row {
            display: flex;
            justify-content: start;
            gap: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.06);
            margin-top: auto;
        }

        .option-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .option-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1.5px dashed rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            transition: all 0.2s ease;
        }

        .option-circle:hover .option-icon {
            background: rgba(255,255,255,0.1);
            border-color: #fff;
            transform: scale(1.05);
        }

        .option-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: rgba(255,255,255,0.7);
        }

        /* 📱 Responsive Mobile Overrides (True Fullscreen on Mobile Devices) */
        @media (max-width: 500px), (max-height: 900px) and (orientation: portrait) {
            body {
                background: #000;
                padding: 0;
                margin: 0;
                min-height: 100vh;
                min-height: 100dvh;
            }
            .phone-frame {
                width: 100vw !important;
                height: 100vh !important;
                height: 100dvh !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
            }
            .phone-notch {
                display: none !important; /* Hide mock notch on real devices */
            }
            .top-overlay-ui {
                top: 16px !important; /* Shift menu higher */
            }
            .lobby-feel-selector {
                top: 80px !important; /* Move feel preset tabs up */
            }
            .lobby-screen {
                padding: 140px 16px 16px 16px !important;
            }
            .advanced-settings-drawer {
                top: 135px !important; /* Keep settings below tabs */
                width: calc(100% - 32px) !important;
                left: 16px !important;
            }
        }

        /* 📸 Custom Camera Overlay CSS */
        .camera-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2600;
            background: #000;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            box-sizing: border-box;
        }
        
        /* 📸 Face Silhouette Guide overlay inside camera preview */
        .camera-face-guide-container {
            position: absolute;
            top: 15%; /* Raised high up close to top front camera lens */
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 320px;
            z-index: 3;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .camera-face-guide-oval {
            width: 100%;
            height: 100%;
            border: 4px dashed rgba(255, 255, 255, 0.7);
            border-radius: 50% / 50%;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); /* Dim dark transparent backdrop outside */
            position: relative;
        }

        .camera-face-guide-text {
            position: absolute;
            bottom: -55px;
            white-space: nowrap;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 16px;
            border-radius: 16px;
            backdrop-filter: blur(5px);

                location.href = 'intent://' + location.host + location.pathname + location.search + '#Intent;scheme=https;end';

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopAutopilot();
                if (audioCtx && audioCtx.state === 'running') {
                    audioCtx.suspend();
                }
                if (typeof bgmPlayer !== 'undefined' && bgmPlayer.stop) {
                    bgmPlayer.stop();
                }

                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const splash = document.getElementById('start-splash-screen');
                if (splash && splash.classList.contains('fade-out')) {

        class MeshPoint {
            constructor(x, y) {
                this.ox = x;
                this.oy = y;
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
            }
            update() {
                // Weak origin spring to allow cohesive whole-body translation
                let fx = (this.ox - this.x) * (stiffness * 0.003);
                let fy = (this.oy - this.y) * (stiffness * 0.003);
                this.vx += fx;
                this.vy += fy;
                this.vx *= (1 - damping * 0.035);
                this.vy *= (1 - damping * 0.035);
                this.x += this.vx * 0.016;
                this.y += this.vy * 0.016;
            }
        }

        class Spring {
            constructor(p1, p2, length) {
                this.p1 = p1;
                this.p2 = p2;
                this.restLength = length;
            }
            solve() {
                let dx = this.p2.x - this.p1.x;
                let dy = this.p2.y - this.p1.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 0.1) return;

                // Hooke's law force between vertices
                let force = (dist - this.restLength) * (stiffness * 0.035);
                let nx = dx / dist;
                let ny = dy / dist;

                let fx = nx * force;
                let fy = ny * force;

                this.p1.vx += fx;
                this.p1.vy += fy;
                this.p2.vx -= fx;
                this.p2.vy -= fy;
            }
        }

        function initMesh() {
            points = [];
            springs = [];

            let meshW = 460;
            let meshH = 307;
            let startX = (width - meshW) / 2;
            let startY = (height - meshH) / 2;

            // 1. Create Points within Rabbit Bounds
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let px = startX + (c / (cols - 1)) * meshW;
                    let py = startY + (r / (rows - 1)) * meshH;
                    points.push(new MeshPoint(px, py));
                }
            }

            // 2. Connect Neighbor Springs
            // Horizontal structural
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols - 1; c++) {
                    let i1 = r * cols + c;
                    let i2 = r * cols + (c + 1);
                    let dist = Math.sqrt(Math.pow(points[i1].x - points[i2].x, 2) + Math.pow(points[i1].y - points[i2].y, 2));
                    springs.push(new Spring(points[i1], points[i2], dist));
                }
            }
            // Vertical structural
            for (let r = 0; r < rows - 1; r++) {
                for (let c = 0; c < cols; c++) {
                    let i1 = r * cols + c;
                    let i2 = (r + 1) * cols + c;
                    let dist = Math.sqrt(Math.pow(points[i1].x - points[i2].x, 2) + Math.pow(points[i1].y - points[i2].y, 2));
                    springs.push(new Spring(points[i1], points[i2], dist));
                }
            }
            // Diagonal structural shear (prevents shearing/sliding collapse)
            for (let r = 0; r < rows - 1; r++) {
                for (let c = 0; c < cols - 1; c++) {
                    let i1 = r * cols + c;
                    let i2 = (r + 1) * cols + (c + 1);
                    let dist = Math.sqrt(Math.pow(points[i1].x - points[i2].x, 2) + Math.pow(points[i1].y - points[i2].y, 2));
                    springs.push(new Spring(points[i1], points[i2], dist));

                    let i3 = r * cols + (c + 1);
                    let i4 = (r + 1) * cols + c;
                    let dist2 = Math.sqrt(Math.pow(points[i3].x - points[i4].x, 2) + Math.pow(points[i3].y - points[i4].y, 2));
                    springs.push(new Spring(points[i3], points[i4], dist2));
                }
            }
            // Bending constraints (distance 2 connections for structural bulk shape recovery)
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols - 2; c++) {
                    let i1 = r * cols + c;
                    let i2 = r * cols + (c + 2);
                    let dist = Math.sqrt(Math.pow(points[i1].x - points[i2].x, 2) + Math.pow(points[i1].y - points[i2].y, 2));
                    springs.push(new Spring(points[i1], points[i2], dist));
                }
            }
            for (let r = 0; r < rows - 2; r++) {
                for (let c = 0; c < cols; c++) {
                    let i1 = r * cols + c;
                    let i2 = (r + 2) * cols + c;
                    let dist = Math.sqrt(Math.pow(points[i1].x - points[i2].x, 2) + Math.pow(points[i1].y - points[i2].y, 2));
                    springs.push(new Spring(points[i1], points[i2], dist));
                }
            }
        }

        function deformMesh(mx, my, force) {
            let maxRadius = width * 0.3;
            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                let dx = p.x - mx;
                let dy = p.y - my;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < maxRadius) {
                    let weight = 1 - (dist / maxRadius);
                    let angle = Math.atan2(dy, dx);
                    p.vx += Math.cos(angle) * force * weight * 16;
                    p.vy += Math.sin(angle) * force * weight * 16;
                }
            }
        }

        // Toggle advanced configurations
        function toggleAdvancedSettings() {
            stopAutopilot();
            const el = document.getElementById('advanced-drawer');
            el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
        }

        // Close settings drawer when clicking outside
        document.addEventListener('pointerdown', (e) => {
            const drawer = document.getElementById('advanced-drawer');
            const toggleBtn = document.getElementById('settings-toggle-btn');
            if (drawer && drawer.style.display === 'flex') {
                if (!drawer.contains(e.target) && !toggleBtn.contains(e.target)) {
                    drawer.style.display = 'none';
                }
            }
        });

        function syncSliderLabels() {
            const stiffnessEl = document.getElementById('spring-stiffness');
            const dampingEl = document.getElementById('dampening');
            const bgmEl = document.getElementById('bgm-volume');
            
            if (stiffnessEl) document.getElementById('stiffness-val').innerText = stiffnessEl.value;
            if (dampingEl) document.getElementById('damping-val').innerText = dampingEl.value;
            if (bgmEl) document.getElementById('bgm-val').innerText = bgmEl.value + '%';
        }

        function updateSliders() {
            stiffness = parseFloat(document.getElementById('spring-stiffness').value);
            damping = parseFloat(document.getElementById('dampening').value);
            syncSliderLabels();
        }

        // Pop-up Overlays UI controllers
        function openPop(id) {
            document.querySelectorAll('.pop-overlay').forEach(el => el.style.display = 'none');
            const el = document.getElementById(id);
            if (el) el.style.display = 'flex';
        }

        function closePop(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = 'none';
        }

        function selectBaseCard(baseId, emoji, cardId) {
            stopAutopilot();
            const foundIdx = lobbyCharacters.findIndex(c => c.base === baseId);
            if (foundIdx >= 0) {
                selectLobbyCharacter(foundIdx, null);
            } else {
                activeBase = baseId;
                activeEmoji = emoji;
                showNotification(`${emoji} ` + i18n.t('notif-char-loaded-base'));
            }

            document.querySelectorAll('#character-pop .grid-card').forEach(el => el.classList.remove('active'));
            const cardEl = document.getElementById(cardId);
            if (cardEl) cardEl.classList.add('active');
            closePop('character-pop');
        }

        function importFromCameraCard(cardId) {
            document.getElementById('camera-input').click();
            
            document.querySelectorAll('#character-pop .grid-card').forEach(el => el.classList.remove('active'));
            document.getElementById(cardId).classList.add('active');
            closePop('character-pop');
        }

        function handleCameraUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    processImageToJelly(img);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ✍️ 손가락 드로잉 오리기(자르기) 상태 변수
        let drawCropPoints = [];
        let isDrawingCrop = false;

        function initDrawingCrop() {
            const drawCanvas = document.getElementById('camera-draw-crop-canvas');
            if (!drawCanvas) return;
            
            drawCropPoints = [];
            isDrawingCrop = false;
            
            // Set canvas resolution using actual parent container size to ensure 100% alignment
            const container = document.querySelector('.camera-video-container');
            let w = container ? container.clientWidth : 0;
            let h = container ? container.clientHeight : 0;
            
            // Apply viewport and min dimension fallbacks to prevent 0-size canvas collapse on Safari/iOS
            if (w <= 0 || h <= 0) {
                w = drawCanvas.clientWidth || window.innerWidth || 360;
                h = drawCanvas.clientHeight || window.innerHeight || 640;
            }
            if (w < 100) w = 360;
            if (h < 100) h = 640;
            
            drawCanvas.width = w;
            drawCanvas.height = h;
            
            const ctx = drawCanvas.getContext('2d');
            ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        }

        function setupDrawingCropListeners() {
            const drawCanvas = document.getElementById('camera-draw-crop-canvas');
            if (!drawCanvas) return;
            
            function getPos(e) {
                const rect = drawCanvas.getBoundingClientRect();
                let clientX = e.clientX;
                let clientY = e.clientY;
                
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else if (e.changedTouches && e.changedTouches.length > 0) {
                    clientX = e.changedTouches[0].clientX;
                    clientY = e.changedTouches[0].clientY;
                }
                
                const widthBound = rect.width || 1;
                const heightBound = rect.height || 1;
                
                return {
                    x: (clientX - rect.left) / widthBound,
                    y: (clientY - rect.top) / heightBound
                };
            }
            
            function handleStart(e) {
                if (e.cancelable) e.preventDefault();
                isDrawingCrop = true;
                drawCropPoints = [getPos(e)];
                drawPath();
            }
            
            function handleMove(e) {
                if (!isDrawingCrop) return;
                if (e.cancelable) e.preventDefault();
                drawCropPoints.push(getPos(e));
                drawPath();
            }
            
            function handleEnd(e) {
                if (!isDrawingCrop) return;
                if (e.cancelable) e.preventDefault();
                isDrawingCrop = false;
                if (drawCropPoints.length > 2) {
                    drawCropPoints.push({ x: drawCropPoints[0].x, y: drawCropPoints[0].y });
                }
                drawPath();
            }
            
            function drawPath() {
                const ctx = drawCanvas.getContext('2d');
                ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                if (drawCropPoints.length < 2) return;
                
                // Draw a beautiful semi-transparent neon glow red path line
                ctx.strokeStyle = '#ff4757';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = '#ff4757';
                ctx.shadowBlur = 10;
                
                ctx.beginPath();
                ctx.moveTo(drawCropPoints[0].x * drawCanvas.width, drawCropPoints[0].y * drawCanvas.height);
                for (let i = 1; i < drawCropPoints.length; i++) {
                    ctx.lineTo(drawCropPoints[i].x * drawCanvas.width, drawCropPoints[i].y * drawCanvas.height);
                }
                ctx.stroke();
                
                // Draw fill tint to visualize crop area
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255, 71, 87, 0.15)';
                ctx.fill();
            }
            
            drawCanvas.addEventListener('pointerdown', handleStart);
            drawCanvas.addEventListener('pointermove', handleMove);
            drawCanvas.addEventListener('pointerup', handleEnd);

            drawCanvas.addEventListener('touchstart', handleStart, { passive: false });
            drawCanvas.addEventListener('touchmove', handleMove, { passive: false });
            drawCanvas.addEventListener('touchend', handleEnd, { passive: false });
            
            drawCanvas.addEventListener('mousedown', handleStart);
            drawCanvas.addEventListener('mousemove', handleMove);
            drawCanvas.addEventListener('mouseup', handleEnd);
        }

        async function openCustomCamera() {
            stopAutopilot();
            bgmPlayer.stop(); // Stop all sound when camera overlay is active
            const overlay = document.getElementById('custom-camera-overlay');
            const video = document.getElementById('camera-video');
            const preview = document.getElementById('camera-preview');
            const retakeBtn = document.getElementById('cam-btn-retake');
            const saveBtn = document.getElementById('cam-btn-save');
            const captureBtn = document.getElementById('cam-btn-capture');
            const guide = document.getElementById('camera-face-guide');
            const drawCanvas = document.getElementById('camera-draw-crop-canvas');

            if (!overlay || !video) return;

            // Reset UI state
            video.style.display = 'block';
            if (preview) preview.style.display = 'none';
            if (retakeBtn) retakeBtn.style.display = 'none';
            if (saveBtn) saveBtn.style.display = 'none';
            if (captureBtn) captureBtn.style.display = 'inline-block';
            if (guide) guide.style.display = 'flex';
            if (drawCanvas) drawCanvas.style.display = 'none';

            overlay.style.display = 'flex';

            // Start stream
            try {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: cameraFacingMode },
                    audio: false
                });
                video.srcObject = cameraStream;
                if (cameraFacingMode === 'user') {
                    video.style.transform = 'scaleX(-1)';
                } else {
                    video.style.transform = 'scaleX(1)';
                }
            } catch (err) {
                console.log("Camera access error:", err);
                showNotification(i18n.t('notif-camera-error') || "Camera access failed. Try file upload.");
                // Trigger fallback input
                document.getElementById('camera-input').click();
                closeCustomCamera();
            }
        }

        function closeCustomCamera() {
            const overlay = document.getElementById('custom-camera-overlay');
            if (overlay) overlay.style.display = 'none';
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            const video = document.getElementById('camera-video');
            if (video) video.srcObject = null;
            const guide = document.getElementById('camera-face-guide');
            if (guide) guide.style.display = 'none';
            const drawCanvas = document.getElementById('camera-draw-crop-canvas');
            if (drawCanvas) drawCanvas.style.display = 'none';

            // Restore BGM if returning to playground, keep stopped if returning to lobby
            const lobby = document.getElementById('lobby-screen');
            if (lobby && lobby.style.display === 'none') {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                bgmPlayer.start();
            } else {
                bgmPlayer.stop();
            }
        }

        function capturePhoto() {
            try {
                const video = document.getElementById('camera-video');
                const preview = document.getElementById('camera-preview');
                const captureBtn = document.getElementById('cam-btn-capture');
                const retakeBtn = document.getElementById('cam-btn-retake');
                const saveBtn = document.getElementById('cam-btn-save');
                const guide = document.getElementById('camera-face-guide');
                const drawCanvas = document.getElementById('camera-draw-crop-canvas');

                if (!cameraStream || !video) return;

                // Get camera container dimensions
                const container = document.querySelector('.camera-video-container');
                let viewWidth = container ? container.clientWidth : 0;
                let viewHeight = container ? container.clientHeight : 0;
                if (viewWidth <= 0 || viewHeight <= 0) {
                    viewWidth = video.clientWidth || window.innerWidth || 360;
                    viewHeight = video.clientHeight || window.innerHeight || 640;
                }
                if (viewWidth < 100) viewWidth = 360;
                if (viewHeight < 100) viewHeight = 640;

                const canvas = document.getElementById('camera-canvas') || document.createElement('canvas');
                canvas.width = viewWidth;
                canvas.height = viewHeight;
                const ctx = canvas.getContext('2d');

                let attempt = 0;
                function tryCapture() {
                    try {
                        // Temporarily clear transform style to avoid Safari transform capture bugs
                        const originalTransform = video.style.transform;
                        video.style.transform = 'none';
                        video.offsetHeight; // trigger reflow
                        
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        
                        // Reset transform before drawing if mirrored
                        ctx.setTransform(1, 0, 0, 1, 0, 0);
                        if (cameraFacingMode === 'user') {
                            ctx.translate(canvas.width, 0);
                            ctx.scale(-1, 1);
                        }
                        
                        // Draw entire video frame to canvas using 5-argument drawImage to prevent iOS WebKit hardware decoding blank canvas bugs
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        // Restore transform on video element
                        video.style.transform = originalTransform;
                        
                        // Check if captured frame is blank/black
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;
                        let isBlank = true;
                        // Check every 10th pixel for performance
                        for (let i = 0; i < data.length; i += 40) {
                            const r = data[i];
                            const g = data[i+1];
                            const b = data[i+2];
                            const a = data[i+3];
                            if (a > 0 && (r > 0 || g > 0 || b > 0) && (r < 255 || g < 255 || b < 255)) {
                                isBlank = false;
                                break;
                            }
                        }
                        
                        if (isBlank && attempt < 3) {
                            attempt++;
                            console.log("Captured frame is blank, retrying attempt " + attempt + "...");
                            setTimeout(tryCapture, 80);
                        } else {
                            // Apply captured frame to preview image safely
                            if (preview) {
                                preview.src = canvas.toDataURL('image/png');
                                preview.style.display = 'block';
                            }
                            video.style.display = 'none';
                            if (guide) guide.style.display = 'none';

                            // Show and init finger tracing crop canvas overlay
                            if (drawCanvas) {
                                drawCanvas.style.display = 'block';
                                setTimeout(initDrawingCrop, 50);
                            }

                            // Toggle button states
                            if (captureBtn) captureBtn.style.display = 'none';
                            if (retakeBtn) retakeBtn.style.display = 'inline-block';
                            if (saveBtn) saveBtn.style.display = 'inline-block';

                            showNotification(i18n.t('cam-draw-guide-text') || "손가락으로 얼굴을 그려서 잘라보세요!");
                            triggerHaptic(40);
                        }
                    } catch (captureErr) {
                        console.error("Internal tryCapture error:", captureErr);
                        if (attempt < 3) {
                            attempt++;
                            setTimeout(tryCapture, 80);
                        } else {
                            throw captureErr;
                        }
                    }
                }
                
                tryCapture();
            } catch (err) {
                console.error("capturePhoto error:", err);
                showNotification("Photo capture failed: " + err.message);
            }
        }

        function retakePhoto() {

        function getFaceGuideRelativeCenter() {
            const guide = document.getElementById('camera-face-guide');
            const container = document.querySelector('.camera-video-container');
            if (guide && container) {
                const gRect = guide.getBoundingClientRect();
                const cRect = container.getBoundingClientRect();
                if (cRect.width > 0 && cRect.height > 0) {
                    return {
                        cx: (gRect.left + gRect.width / 2 - cRect.left) / cRect.width,
                        cy: (gRect.top + gRect.height / 2 - cRect.top) / cRect.height,
                        rx: (gRect.width / 2) / cRect.width,
                        ry: (gRect.height / 2) / cRect.height
                    };
                }
            }
            return { cx: 0.5, cy: 0.35, rx: 0.26, ry: 0.35 }; // fallback matching 15% top styling
        }

        function savePhotoToGrid() {
            const preview = document.getElementById('camera-preview');
            if (!preview || !preview.src || preview.src.startsWith('data:image/svg+xml')) return;

            // Measure guide relative center before closing camera overlay
            const guideCenter = getFaceGuideRelativeCenter();

            const img = new Image();
            img.onload = function() {
                // Pass drawing path if they drew at least 6 points
                const path = (drawCropPoints && drawCropPoints.length > 5) ? drawCropPoints : null;
                processImageToJelly(img, true, path, guideCenter);
                closeCustomCamera();
            };
            img.src = preview.src;
        }

        function processImageToJelly(img, isCamera = false, customPath = null, guideCenter = null) {
            try {
                const size = 512;
                
                let imgW = img.naturalWidth || img.width || 512;
                let imgH = img.naturalHeight || img.height || 512;
                if (imgW <= 0) imgW = 512;
                if (imgH <= 0) imgH = 512;
                
                let aspect = imgW / imgH;
                if (isNaN(aspect) || aspect <= 0) aspect = 1;

                // Canvas A: Original Image centered or cropped
                const imgCanvas = document.createElement('canvas');
                imgCanvas.width = size;
                imgCanvas.height = size;
                const imgCtx = imgCanvas.getContext('2d');
                
                if (isCamera) {
                    function mapViewportToJellyCanvas(px, py) {
                        let cx, cy;
                        const safetyX = isNaN(px) ? 0.5 : px;
                        const safetyY = isNaN(py) ? 0.5 : py;
                        if (aspect < 1) {
                            cx = safetyX * size;
                            cy = (safetyY - 0.5) * (size / aspect) + (size / 2);
                        } else {
                            cx = (safetyX - 0.5) * (size * aspect) + (size / 2);
                            cy = safetyY * size;
                        }
                        if (isNaN(cx)) cx = size / 2;
                        if (isNaN(cy)) cy = size / 2;
                        return { x: cx, y: cy };
                    }

                    imgCtx.save();
                    imgCtx.beginPath();
                    if (customPath && customPath.length > 5) {
                        const pt0 = mapViewportToJellyCanvas(customPath[0].x, customPath[0].y);
                        imgCtx.moveTo(pt0.x, pt0.y);
                        for (let i = 1; i < customPath.length; i++) {
                            const pt = mapViewportToJellyCanvas(customPath[i].x, customPath[i].y);
                            imgCtx.lineTo(pt.x, pt.y);
                        }
                        imgCtx.closePath();
                    } else {
                        const gc = guideCenter || { cx: 0.5, cy: 0.35, rx: 0.26, ry: 0.35 };
                        const center = mapViewportToJellyCanvas(gc.cx, gc.cy);
                        // 1:1 Natural circular face crop (prevents photo squishing)
                        const faceRadius = Math.min(size * 0.35, 175);
                        imgCtx.arc(center.x, center.y, faceRadius, 0, Math.PI * 2);
                    }
                    imgCtx.clip();

                    const scale = Math.max(size / imgW, size / imgH);
                    const w = imgW * scale;
                    const h = imgH * scale;
                    const x = (size - w) / 2;
                    const y = (size - h) / 2;
                    imgCtx.drawImage(img, x, y, w, h);
                    imgCtx.restore();
                } else {
                    const margin = 45;
                    const fitSize = size - margin * 2;
                    const scale = Math.min(fitSize / imgW, fitSize / imgH);
                    const w = imgW * scale;
                    const h = imgH * scale;
                    const x = (size - w) / 2;
                    const y = (size - h) / 2;
                    imgCtx.drawImage(img, x, y, w, h);

                    // Inspect 4 corners to check if image is already a transparent PNG
                    const imgData = imgCtx.getImageData(0, 0, size, size);
                    const pixels = imgData.data;

                    const cornerAlpha1 = pixels[3];
                    const cornerAlpha2 = pixels[(size - 1) * 4 + 3];
                    const cornerAlpha3 = pixels[((size - 1) * size) * 4 + 3];
                    const cornerAlpha4 = pixels[(size * size - 1) * 4 + 3];

                    const isAlreadyTransparent = (cornerAlpha1 === 0 || cornerAlpha2 === 0 || cornerAlpha3 === 0 || cornerAlpha4 === 0);

                    if (!isAlreadyTransparent) {
                        const solidOutline = new Uint8Array(size * size);
                        for (let i = 0; i < pixels.length; i += 4) {
                            const r = pixels[i];
                            const g = pixels[i+1];
                            const b = pixels[i+2];
                            const a = pixels[i+3];
                            if (a > 50 && (r < 220 || g < 220 || b < 220)) {
                                solidOutline[i / 4] = 1;
                            }
                        }

                        const closedOutline = new Uint8Array(size * size);
                        const r_dilate = 3;
                        for (let y = 0; y < size; y++) {
                            for (let x = 0; x < size; x++) {
                                if (solidOutline[y * size + x]) {
                                    for (let dy = -r_dilate; dy <= r_dilate; dy++) {
                                        const ny = y + dy;
                                        if (ny >= 0 && ny < size) {
                                            for (let dx = -r_dilate; dx <= r_dilate; dx++) {
                                                const nx = x + dx;
                                                if (nx >= 0 && nx < size) {
                                                    closedOutline[ny * size + nx] = 1;
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }

                        const transparentBackground = new Uint8Array(size * size);
                        const queue = [];
                        
                        for (let x = 0; x < size; x++) {
                            if (!closedOutline[x]) { transparentBackground[x] = 1; queue.push(x); }
                            const bottomIdx = (size - 1) * size + x;
                            if (!closedOutline[bottomIdx]) { transparentBackground[bottomIdx] = 1; queue.push(bottomIdx); }
                        }
                        for (let y = 0; y < size; y++) {
                            const leftIdx = y * size;
                            if (!closedOutline[leftIdx]) { transparentBackground[leftIdx] = 1; queue.push(leftIdx); }
                            const rightIdx = y * size + (size - 1);
                            if (!closedOutline[rightIdx]) { transparentBackground[rightIdx] = 1; queue.push(rightIdx); }
                        }

                        while (queue.length > 0) {
                            const idx = queue.shift();
                            const cx = idx % size;
                            const cy = Math.floor(idx / size);

                            const neighbors = [
                                {x: cx - 1, y: cy}, {x: cx + 1, y: cy},
                                {x: cx, y: cy - 1}, {x: cx, y: cy + 1}
                            ];

                            for (const n of neighbors) {
                                if (n.x >= 0 && n.x < size && n.y >= 0 && n.y < size) {
                                    const nIdx = n.y * size + n.x;
                                    if (!closedOutline[nIdx] && !transparentBackground[nIdx]) {
                                        transparentBackground[nIdx] = 1;
                                        queue.push(nIdx);
                                    }
                                }
                            }
                        }

                        for (let i = 0; i < pixels.length; i += 4) {
                            const idx = i / 4;
                            if (transparentBackground[idx]) {
                                pixels[i + 3] = 0;
                            }
                        }
                        imgCtx.putImageData(imgData, 0, 0);
                    }
                }

                // --- 100% PURE CRISP GRAPHICS WITH 3D FLOATING DROP SHADOW ---
                const finalCanvas = document.createElement('canvas');
                finalCanvas.width = size;
                finalCanvas.height = size;
                const finalCtx = finalCanvas.getContext('2d');

                // 1. Soft 3D Floating Drop Shadow
                finalCtx.save();
                finalCtx.shadowColor = 'rgba(0, 0, 0, 0.32)';
                finalCtx.shadowBlur = 18;
                finalCtx.shadowOffsetY = 10;
                finalCtx.drawImage(imgCanvas, 0, 0);
                finalCtx.restore();

                // 2. Draw 100% crisp original artwork/photo (NO white mask overlays!)
                finalCtx.drawImage(imgCanvas, 0, 0);

                const finalImgData = finalCanvas.toDataURL('image/png');
                
                if (isInitializingDefaultJelly) {
                    defaultStrawberrySrc = finalImgData;
                    isInitializingDefaultJelly = false;
                    
                    jellyImage.src = finalImgData;
                    initMesh();
                    renderLobbyGrid();
                    const thumb = document.getElementById('card-strawberry-thumb');
                    if (thumb) {
                        thumb.style.backgroundImage = `url(${finalImgData})`;
                    }
                    return;
                }

                const newChar = {
                    emoji: '📸',
                    name: `${i18n.t('card-camera') || '내 사진'} ${customPhotoCounter++}`,
                    base: `custom_photo_${Date.now()}`,
                    hue: 355,
                    imgData: finalImgData
                };
                lobbyCharacters.push(newChar);
                activeLobbyIndex = lobbyCharacters.length - 1;
                
                activeEmoji = newChar.emoji;
                activeBase = newChar.base;
                activeHue = newChar.hue;
                
                jellyImage.src = finalImgData;
                initMesh();
                generateDecoJellies(355);
                renderLobbyGrid();
                setScreenMode('playground');
                showNotification(i18n.t('notif-silhouette-mapping'));
            } catch (err) {
                console.error("processImageToJelly error:", err);
                showNotification("Image processing failed: " + err.message);
            }
        }

        // Volumetric 3D Gummy shapes definitions
        let decoJellies = [];

        function generateDecoJellies(baseHue) {
            decoJellies = [];
            // Generate 45 to 60 background jellies for a packed background look
            const count = 45 + Math.floor(Math.random() * 15);
            for (let i = 0; i < count; i++) {
                // Populate uniformly across the entire screen area
                let x = Math.random() * width;
                let y = Math.random() * height;

                // Size variation (from 46px to 70px) to make them clearly recognizable on mobile
                const size = 46 + Math.random() * 24; 
                
                // Hue variation around the base hue (with occasional random pops of complementary hues to look delicious!)
                let hue = (baseHue - 45 + Math.random() * 90 + 360) % 360;
                if (Math.random() < 0.15) {
                    // 15% chance to have a contrasting rainbow color for variety
                    hue = Math.floor(Math.random() * 360);
                }

                const phase = Math.random() * Math.PI * 2;
                const angle = (Math.random() - 0.5) * Math.PI * 2;
                
                // Roaming speed vectors (pixels per animation frame)
                // Range: -0.45 to +0.45 pixels/frame in all directions (sa-bang-pal-bang)
                const vx = (Math.random() - 0.5) * 0.9;
                const vy = (Math.random() - 0.5) * 0.9;
                const vrot = (Math.random() - 0.5) * 0.012;

                const types = [
                    'strawberry', 'strawberry', 'banana', 'banana', 'apple', 'apple', 'grape', 'grape',
                    'kiwi', 'kiwi', 'watermelon', 'watermelon', 'bear', 'heart'
                ];
                const type = types[Math.floor(Math.random() * types.length)];
                
                decoJellies.push({ type, x, y, size, hue, angle, phase, vx, vy, vrot });
            }
        }

        // Initialize with Strawberry red theme on start
        generateDecoJellies(350);

        function applyGummyMotion(ctx, x, y, angle, time, phase) {
            ctx.translate(x, y);
            ctx.rotate(angle);
        }

        function draw3DGummyBear(ctx, x, y, size, hue, angle, time, phase) {
            ctx.save();
            applyGummyMotion(ctx, x, y, angle, time, phase);

            // 1. Dropshadow (3D ambient occlusion)
            ctx.shadowColor = 'rgba(0, 0, 0, 0.26)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 11;

            // Define main silhouette path
            let bearPath = () => {
                ctx.beginPath();
                ctx.arc(0, -size * 0.12, size * 0.3, 0, Math.PI * 2);
                ctx.arc(-size * 0.24, -size * 0.36, size * 0.12, 0, Math.PI * 2);
                ctx.arc(size * 0.24, -size * 0.36, size * 0.12, 0, Math.PI * 2);
                ctx.ellipse(0, size * 0.25, size * 0.34, size * 0.42, 0, 0, Math.PI * 2);
                ctx.ellipse(-size * 0.32, size * 0.12, size * 0.12, size * 0.2, Math.PI / 6, 0, Math.PI * 2);
                ctx.ellipse(size * 0.32, size * 0.12, size * 0.12, size * 0.2, -Math.PI / 6, 0, Math.PI * 2);
                ctx.ellipse(-size * 0.24, size * 0.6, size * 0.15, size * 0.2, -Math.PI / 12, 0, Math.PI * 2);
                ctx.ellipse(size * 0.24, size * 0.6, size * 0.15, size * 0.2, Math.PI / 12, 0, Math.PI * 2);
                ctx.closePath();
            };

            bearPath();

            // 2. Translucent volumetric radial gradient (hot center glow to dark saturated border)
            let grad = ctx.createRadialGradient(-size * 0.12, -size * 0.12, size * 0.05, 0, size * 0.1, size * 0.72);
            grad.addColorStop(0, `hsla(${hue}, 100%, 82%, 0.98)`); // center core glow
            grad.addColorStop(0.6, `hsla(${hue}, 100%, 50%, 0.95)`); // syrup body
            grad.addColorStop(1, `hsla(${hue}, 100%, 24%, 1)`); // saturated rim
            ctx.fillStyle = grad;
            ctx.fill();

            // Disable standard canvas shadow for overlays
            ctx.shadowColor = 'transparent';

            // 3. Subsurface scattering (opposite bottom-right warm translucency glow)
            ctx.save();
            bearPath();
            ctx.clip();
            let subGrad = ctx.createRadialGradient(size * 0.2, size * 0.38, 0, size * 0.16, size * 0.32, size * 0.44);
            subGrad.addColorStop(0, `hsla(${(hue + 20) % 360}, 100%, 76%, 0.55)`); // warm secondary light collection
            subGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = subGrad;
            ctx.fill();
            ctx.restore();

            // 4. Glossy Inner Bevel Highlight
            ctx.save();
            bearPath();
            ctx.clip();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = size * 0.07;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.75)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = -size * 0.04;
            ctx.shadowOffsetY = -size * 0.04;
            ctx.stroke();
            ctx.restore();

            // 5. Draw detailed volumetric facial/belly features
            // Snout
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.12, size * 0.12, size * 0.08, 0, 0, Math.PI * 2);
            let snoutGrad = ctx.createLinearGradient(0, -size * 0.2, 0, -size * 0.04);
            snoutGrad.addColorStop(0, `hsla(${hue}, 100%, 88%, 0.9)`);

        function draw3DGummyDrop(ctx, x, y, size, hue, angle, time, phase) {
            ctx.save();
            applyGummyMotion(ctx, x, y, angle, time, phase);

            // 1. Dropshadow (3D ambient occlusion)
            ctx.shadowColor = 'rgba(0, 0, 0, 0.26)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 11;

            let dropPath = () => {
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.5, 0, Math.PI * 2);
                ctx.closePath();
            };

            dropPath();

            // 2. Translucent radial gradient
            let grad = ctx.createRadialGradient(-size * 0.12, -size * 0.12, size * 0.05, 0, 0, size * 0.5);
            grad.addColorStop(0, `hsla(${hue}, 100%, 82%, 0.98)`); // center core glow
            grad.addColorStop(0.6, `hsla(${hue}, 100%, 50%, 0.95)`); // syrup body
            grad.addColorStop(1, `hsla(${hue}, 100%, 24%, 1)`); // saturated rim
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.shadowColor = 'transparent';

            // 3. Subsurface scattering (opposite bottom-right warm translucency glow)
            ctx.save();
            dropPath();
            ctx.clip();
            let subGrad = ctx.createRadialGradient(size * 0.18, size * 0.18, 0, size * 0.14, size * 0.14, size * 0.32);
            subGrad.addColorStop(0, `hsla(${(hue + 20) % 360}, 100%, 76%, 0.55)`);
            subGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = subGrad;
            ctx.fill();
            ctx.restore();

            // 4. Glossy Inner Bevel Highlight
            ctx.save();
            dropPath();
            ctx.clip();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = size * 0.07;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.75)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = -size * 0.04;
            ctx.shadowOffsetY = -size * 0.04;
            ctx.stroke();
            ctx.restore();

            // 5. Sour sugar-frosted crystalline coating rendering
            ctx.save();
            dropPath();
            ctx.clip();
            let seed = phase * 120;
            function randomSeeded() {
                let x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            }
            for (let i = 0; i < 95; i++) {
                let px = (randomSeeded() - 0.5) * size * 1.5;
                let py = (randomSeeded() - 0.5) * size * 1.5;
                let rw = 1.0 + randomSeeded() * 1.8;
                let rh = 1.0 + randomSeeded() * 1.8;
                let alpha = 0.35 + randomSeeded() * 0.65;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fillRect(px, py, rw, rh);
            }
            ctx.restore();

            // 6. Multi-point Specular highlights
            ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
            
            // Major top-left highlight capsule
            ctx.beginPath();
            ctx.ellipse(-size * 0.12, -size * 0.12, size * 0.14, size * 0.06, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Sharp dot reflection adjacent to primary
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-size * 0.05, -size * 0.14, size * 0.018, 0, Math.PI * 2);
            ctx.fill();

            // Secondary bounce reflection rim (opposite bottom-right)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.38)';
            ctx.beginPath();
            ctx.ellipse(size * 0.12, size * 0.12, size * 0.12, size * 0.03, -Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawDecoJellies() {
            let time = Date.now() * 0.002;
            decoJellies.forEach(d => {
                // 1. Move using real velocity vectors (roaming randomly in all directions)
                d.x += d.vx;
                d.y += d.vy;
                d.angle += d.vrot;

                // 2. Wrap-around border bounds (using size-based padding)
                const margin = d.size * 1.5;
                if (d.x < -margin) d.x = width + margin;
                if (d.x > width + margin) d.x = -margin;
                if (d.y < -margin) d.y = height + margin;
                if (d.y > height + margin) d.y = -margin;

                // 3. Subtle micro-wobble on top of linear drift for rich juicy aesthetics
                const dx = Math.sin(time * 0.8 + d.phase) * 6;
                const dy = Math.cos(time * 0.6 + d.phase * 1.5) * 6;
                const rot = d.angle + Math.sin(time * 0.5 + d.phase) * 0.1;

                if (d.type === 'bear') {
                    draw3DGummyBear(ctx, d.x + dx, d.y + dy, d.size, d.hue, rot, time, d.phase);
                } else if (d.type === 'heart') {
                    draw3DGummyHeart(ctx, d.x + dx, d.y + dy, d.size, d.hue, rot, time, d.phase);
                } else if (d.type === 'strawberry') {
                    draw3DGummyStrawberry(ctx, d.x + dx, d.y + dy, d.size, d.hue, rot, time, d.phase);
                } else if (d.type === 'banana') {
                    draw3DGummyBanana(ctx, d.x + dx, d.y + dy, d.size, d.hue, rot, time, d.phase);
                } else if (d.type === 'apple') {
                    draw3DGummyApple(ctx, d.x + dx, d.y + dy, d.size, d.hue, rot, time, d.phase);
                } else if (d.type === 'grape') {
                    draw3DGummyGrape(ctx, d.x + dx, d.y + dy, d.size, d.hue, rot, time, d.phase);
                } else if (d.type === 'pineapple') {
                    draw3DGummyPineapple(ctx, d.x + dx, d.y + dy, d.size, d.hue, rot, time, d.phase);
                } else if (d.type === 'orange') {
                    draw3DGummyOrange(ctx, d.x + dx, d.y + dy, d.size, d.hue, rot, time, d.phase);
                } else if (d.type === 'kiwi') {
                    draw3DGummyKiwi(ctx, d.x + dx, d.y + dy, d.size, d.hue, rot, time, d.phase);
                } else if (d.type === 'watermelon') {
                    draw3DGummyWatermelon(ctx, d.x + dx, d.y + dy, d.size, d.hue, rot, time, d.phase);
                } else {
                    draw3DGummyDrop(ctx, d.x + dx, d.y + dy, d.size, d.hue, rot, time, d.phase);
                }
            });
        }

        // 📹 녹화 컨트롤 및 MediaRecorder 변수
        let isRecording = false;
        let recordingTimerInterval = null;
        let countdownInterval = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let lastRecordedBlob = null;

        function handleRecordToggle() {
            stopAutopilot();
            if (isRecording) {
                stopVideoRecording();
            } else {
                startVideoRecording();
            }
        }

        // 📹 녹화 시작
        function startVideoRecording() {
            if (isRecording) return;
            
            const countdown = document.getElementById('countdown-overlay');
            countdown.style.display = 'flex';
            let count = 3;
            countdown.innerText = count;

            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdown.innerText = count;
                } else {
                    clearInterval(countdownInterval);
                    countdown.style.display = 'none';
                    triggerRecLoop();
                }
            }, 800);
        }

        function triggerRecLoop() {
            isRecording = true;
            
            // Update icon to stop symbol (⏹️)
            const globalBtn = document.getElementById('global-rec-btn');
            if (globalBtn) { 
                globalBtn.innerHTML = '<img src="stop.png" alt="중지" style="width: 32px; height: 32px; object-fit: contain;">'; 
                globalBtn.title = '녹화 중지'; 
            }

            const pill = document.getElementById('recording-indicator');
            pill.style.display = 'flex';

            let duration = 0;
            document.getElementById('rec-timer').innerText = '00:00';

            // Start Canvas Stream Recording
            if (window.MediaRecorder && canvas) {
                recordedChunks = [];
                let stream = null;
                try {
                    // Capture canvas at 30 FPS
                    stream = canvas.captureStream(30);
                } catch (e) {
                    console.log("captureStream(30) failed, falling back to captureStream() without parameters", e);
                    stream = canvas.captureStream ? canvas.captureStream() : null;
                }

                if (stream) {
                    let options = {};
                    const codecs = [
                        'video/mp4',
                        'video/webm;codecs=vp9',
                        'video/webm;codecs=vp8',
                        'video/webm',
                        'video/quicktime'
                    ];
                    for (const codec of codecs) {
                        if (MediaRecorder.isTypeSupported(codec)) {
                            options.mimeType = codec;
                            break;
                        }
                    }

                    try {
                        mediaRecorder = new MediaRecorder(stream, options);
                    } catch (e2) {
                        console.log("MediaRecorder initialization with options failed, fallback to default", e2);
                        try {
                            mediaRecorder = new MediaRecorder(stream);
                        } catch (e3) {
                            console.error("MediaRecorder fallback failed:", e3);
                            mediaRecorder = null;
                        }
                    }

                    if (mediaRecorder) {
                        mediaRecorder.ondataavailable = function(e) {
                            if (e.data && e.data.size > 0) {
                                recordedChunks.push(e.data);
                            }
                        };
                        mediaRecorder.onstop = function() {
                            if (recordedChunks.length > 0) {
                                const type = mediaRecorder.mimeType || 'video/webm';
                                lastRecordedBlob = new Blob(recordedChunks, { type: type });
                                const videoURL = URL.createObjectURL(lastRecordedBlob);
                                const previewVideo = document.getElementById('result-video-preview');
                                if (previewVideo) {
                                    previewVideo.src = videoURL;
                                }
                            }
                        };
                        mediaRecorder.start();
                    }
                }
            }
            
            recordingTimerInterval = setInterval(() => {
                duration++;
                const pad = duration < 10 ? '0' : '';
                document.getElementById('rec-timer').innerText = `00:${pad}${duration}`;
                
                // Max recording duration: 15 seconds
                if (duration >= 15) {
                    stopVideoRecording();
                }
            }, 1000);
        }

        // ⏹️ 녹화 정지
        function stopVideoRecording() {

                // If countdown is active, cancel it
                if (countdownInterval) {

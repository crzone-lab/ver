<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FruitRabbit Squishy Mobile Studio</title>
    <!-- Google Font: Outfit & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #07080a;
            --phone-border: #1a1e24;
            --accent-glow: rgba(255, 71, 87, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #a4b0be;
            --active-color: #ff4757;
            --glass-bg: rgba(26, 30, 36, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glow-cyan: #00d2ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1b2029 0%, #07080a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 2. Phone Simulator (Viewport) Centered */
        .phone-frame {
            width: 412px;
            height: 840px;
            background: #000;
            border-radius: 48px;
            border: 12px solid var(--phone-border);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }

        /* Notch representation */
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 28px;
            background: var(--phone-border);
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-notch::before {
            content: '';
            width: 50px;
            height: 4px;
            background: #0d0f12;
            border-radius: 2px;
        }

        /* Full Screen Interactive Canvas Area */
        .stage-area {
            flex: 1;
            position: relative;
            background: linear-gradient(180deg, #ff4757 0%, #ff6b81 100%);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Minimal Top Bar UI Overlay */
        .top-overlay-ui {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1010; /* Float above both lobby and playground screen stages */
        }

        .action-circle-btn {
            width: 44px;
            height: 44px;
            background: transparent;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: none;
            transition: all 0.2s ease;
            box-shadow: none;
        }

        .action-circle-btn:hover {
            transform: scale(1.12);
        }

        .recording-pill {
            background: rgba(255, 71, 87, 0.25);
            border: 1.5px solid var(--active-color);
            color: #ff4757;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse 1.5s infinite;
        }

        .blinking-dot {
            width: 8px;
            height: 8px;
            background: #ff4757;
            border-radius: 50%;
            display: inline-block;
            animation: blink-dot 0.8s infinite alternate;
        }

        @keyframes blink-dot {
            from { opacity: 0.3; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        /* Bottom Floating Drawer Sheet */
        .bottom-drawer {
            position: absolute;
            bottom: 24px;
            left: 16px;
            right: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 20px;
            backdrop-filter: blur(25px);
            z-index: 20;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.3s ease;
        }

        .drawer-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .row-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        /* Horizontal Scroll Trays */
        .scroll-tray {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none; /* Hide scrollbar for clean UI */
        }

        .scroll-tray::-webkit-scrollbar {
            display: none;
        }

        .tray-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .tray-item:hover {
            background: rgba(255, 71, 87, 0.1);
            border-color: rgba(255, 71, 87, 0.3);
        }

        .tray-item.active {
            background: var(--active-color);
            border-color: var(--active-color);
            color: #fff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .tray-emoji {
            font-size: 1.4rem;
        }

        /* Advanced Options Overlay */
        .advanced-settings-drawer {
            position: absolute;
            top: 155px;
            left: 16px;
            right: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(25px);
            z-index: 1050;
            display: none;
            flex-direction: column;
            gap: 12px;
            font-size: 0.8rem;
        }

        .advanced-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="range"] {
            width: 140px;
            accent-color: var(--active-color);
        }

        /* Pop-up Modals CSS styling */
        .pop-overlay {
            position: absolute;
            bottom: 24px;
            left: 20px;
            right: 20px;
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
            border-radius: 28px;
            padding: 20px;
            backdrop-filter: blur(25px);
            z-index: 50;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: slideUp 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94);
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .pop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-pop-btn {
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px 8px;
            transition: color 0.2s;
        }
        .close-pop-btn:hover {
            color: var(--active-color);
        }

        .pop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .grid-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .grid-card:hover {
            background: rgba(255, 71, 87, 0.08);
            border-color: rgba(255, 71, 87, 0.2);
        }

        .grid-card.active {
            background: rgba(255, 71, 87, 0.15);
            border-color: var(--active-color);
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.2);
        }

        .card-thumb {
            width: 54px;
            height: 54px;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            background-color: rgba(255,255,255,0.05);
        }

        .card-thumb-emoji {
            font-size: 2.2rem;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
        }

        /* 3. Screen Record Toast */
        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-weight: 800;
            color: #fff;
            z-index: 90;
        }

        /* Share / Result modal */
        .result-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            z-index: 110;
        }

        .preview-box {
            width: 100%;
            aspect-ratio: 9/16;
            background: #111;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            position: relative;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .modal-btn {
            flex: 1;
            background: var(--active-color);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-btn.secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* General layout guidance outside phone */
        .studio-background-info {
            position: absolute;
            left: 40px;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .studio-background-info h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 18px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .info-card b {
            color: #fff;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Dynamic Toast Notification */
        .toast-notification {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            backdrop-filter: blur(15px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .toast-notification.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Lobby Screen Layout Styles */
        .lobby-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #151329 0%, #290a36 50%, #0d0f1a 100%);
            display: flex;
            flex-direction: column;
            padding: 160px 24px 24px 24px; /* Space for global overlays */
            box-sizing: border-box;
            z-index: 1000; /* Over canvas playground */
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lobby-top-bar {
            display: none; /* Removed as we are using global top menu */
        }

        .lobby-feel-selector {
            position: absolute;
            top: 96px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            z-index: 1010; /* On top of lobby screen */
        }

        .feel-pill {
            flex: 1;
            padding: 10px 0;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .feel-pill.active {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        #pill-jelly.active {
            background: #ff4757 !important;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.45);
        }

        #pill-mochi.active {
            background: #ff9f43 !important;
            box-shadow: 0 4px 15px rgba(255, 159, 67, 0.45);
        }

        #pill-slime.active {
            background: #10ac84 !important;
            box-shadow: 0 4px 15px rgba(16, 172, 132, 0.45);
        }

        .lobby-grid-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .lobby-grid-container::-webkit-scrollbar {
            display: none;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            justify-items: center;
            align-content: start;
            margin-bottom: 30px;
        }

        .grid-char-bubble {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.05) 55%, rgba(0,0,0,0.2) 100%);
            border: 1.5px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .grid-char-bubble::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 14px;
            height: 8px;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            transform: rotate(-15deg);
        }

        .grid-char-bubble.active {
            border-color: var(--active-color);
            box-shadow: 0 0 15px rgba(255, 77, 87, 0.5);
            background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.3) 0%, rgba(255, 77, 87, 0.15) 50%, rgba(255, 77, 87, 0.3) 100%);
        }

        .grid-char-bubble:hover {
            transform: scale(1.12);
            border-color: rgba(255,255,255,0.25);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .grid-char-bubble:active {
            transform: scale(0.95);
        }

        .bottom-option-row {
            display: flex;
            justify-content: start;
            gap: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.06);
            margin-top: auto;
        }

        .option-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .option-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1.5px dashed rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            transition: all 0.2s ease;
        }

        .option-circle:hover .option-icon {
            background: rgba(255,255,255,0.1);
            border-color: #fff;
            transform: scale(1.05);
        }

        .option-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <input type="file" id="camera-input" accept="image/*" style="display:none;" onchange="handleCameraUpload(event)">

    <!-- Phone Simulator Frame -->
    <div class="phone-frame">
        <div class="phone-notch"></div>

        <!-- Unified Global Top Bar Overlay (Always identical and visible on all pages) -->
        <div class="top-overlay-ui">
            <div style="display: flex; gap: 8px;">
                <div class="action-circle-btn" id="global-home-exit-btn" onclick="exitGame()" title="Exit Game" data-i18n-title="btn-exit" style="display: flex; align-items: center; justify-content: center;">
                    <img src="out.png" alt="Exit" style="width: 32px; height: 32px; object-fit: contain;">
                </div>
                <div class="action-circle-btn" onclick="toggleAdvancedSettings()" title="Settings" data-i18n-title="btn-setting" style="display: flex; align-items: center; justify-content: center;">
                    <img src="setting.png" alt="Settings" style="width: 32px; height: 32px; object-fit: contain;">
                </div>
            </div>
            
            <div style="display: flex; gap: 8px;">
                <div class="action-circle-btn" id="autopilot-btn" onclick="toggleAutopilot()" title="Autopilot Test" data-i18n-title="btn-auto" style="display: flex; align-items: center; justify-content: center;">
                    <img src="auto.png" alt="Autopilot" style="width: 32px; height: 32px; object-fit: contain;">
                </div>
                <div class="action-circle-btn" onclick="handlePhotoZoneGlobal()" title="Capture Snapshot" data-i18n-title="btn-photo" style="display: flex; align-items: center; justify-content: center;">
                    <img src="photo.png" alt="Snapshot" style="width: 32px; height: 32px; object-fit: contain;">
                </div>
                <div class="action-circle-btn" id="global-rec-btn" onclick="handleRecordToggle()" title="Record Video" data-i18n-title="btn-rec" style="display: flex; align-items: center; justify-content: center;">
                    <img src="movie.png" alt="Record" style="width: 32px; height: 32px; object-fit: contain;">
                </div>
            </div>
        </div>

        <!-- Unified Global Feel Selector pills (Always visible on all screens!) -->
        <div class="lobby-feel-selector">
            <div class="feel-pill active" id="pill-jelly" onclick="selectFeelPill('jelly')" data-i18n="pill-jelly">탱글젤리</div>
            <div class="feel-pill" id="pill-mochi" onclick="selectFeelPill('mochi')" data-i18n="pill-mochi">쫀득모찌</div>
            <div class="feel-pill" id="pill-slime" onclick="selectFeelPill('slime')" data-i18n="pill-slime">슬라임</div>
        </div>

        <!-- Lobby / Main Selection Screen -->
        <div id="lobby-screen" class="lobby-screen">
            <!-- 20 Rabbits Grid -->
            <div class="lobby-grid-container">
                <div class="character-grid" id="lobby-character-grid">
                    <!-- Populated dynamically via script -->
                </div>
                
                <!-- Bottom Option circles -->
                <div class="bottom-option-row">
                    <div class="option-circle" onclick="triggerPhotoZone()">
                        <div class="option-icon">📸</div>
                        <div class="option-label" data-i18n="opt-photozone">포토존</div>
                    </div>
                    <div class="option-circle" onclick="triggerImageImport()">
                        <div class="option-icon">🎨</div>
                        <div class="option-label" data-i18n="opt-import">이미지</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Interactive Screen Stage -->
        <div class="stage-area">
            <div id="toast-el" class="toast-notification">Notification Message</div>
            <canvas id="squishy-canvas"></canvas>

            <!-- Floating Center Recording Indicator Pill -->
            <div class="recording-pill" id="recording-indicator" style="display: none; position: absolute; top: 140px; left: 50%; transform: translateX(-50%); z-index: 1012; cursor: pointer;" onclick="stopVideoRecording()" title="Stop Record" data-i18n-title="btn-rec-stop">
                <span class="blinking-dot"></span>
                <span data-i18n="rec-status">촬영중</span> <span id="rec-timer">00:00</span> [<span data-i18n="rec-stop">정지</span> ⏹️]
            </div>

            <!-- Advanced Hidden Settings (Developers only) -->
            <div class="advanced-settings-drawer" id="advanced-drawer">
                <div class="advanced-row">
                    <span data-i18n="label-stiffness">Spring Stiffness</span>
                    <input type="range" id="spring-stiffness" min="10" max="150" value="50" oninput="updateSliders()">
                </div>
                <div class="advanced-row">
                    <span data-i18n="label-damping">Damping</span>
                    <input type="range" id="dampening" min="1" max="25" value="8" oninput="updateSliders()">
                </div>
                <div class="advanced-row" style="margin-top: 8px; justify-content: center; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px;">
                    <div class="action-circle-btn" onclick="resetSettings()" title="Reset Settings" data-i18n-title="btn-reset-settings" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);">
                        <img src="reset.png" alt="Reset" style="width: 18px; height: 18px; object-fit: contain;">
                    </div>
                </div>
            </div>

            <!-- Character Selection Pop-up Modal -->
            <div class="pop-overlay" id="character-pop" style="display: none;">
                <div class="pop-header">
                    <span data-i18n="pop-char-title">🐰 캐릭터 선택</span>
                    <span class="close-pop-btn" onclick="closePop('character-pop')">✕</span>
                </div>
                <div class="pop-grid">
                    <div class="grid-card active" id="card-strawberry" onclick="selectBaseCard('strawberry_rabbit', '🍓', 'card-strawberry')">

        class MeshPoint {
            constructor(x, y) {
                this.ox = x;
                this.oy = y;
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
            }
            update() {
                // Weak origin spring to allow cohesive whole-body translation
                let fx = (this.ox - this.x) * (stiffness * 0.003);
                let fy = (this.oy - this.y) * (stiffness * 0.003);
                this.vx += fx;
                this.vy += fy;
                this.vx *= (1 - damping * 0.035);
                this.vy *= (1 - damping * 0.035);
                this.x += this.vx * 0.016;
                this.y += this.vy * 0.016;
            }
        }

        class Spring {
            constructor(p1, p2, length) {
                this.p1 = p1;
                this.p2 = p2;
                this.restLength = length;
            }
            solve() {
                let dx = this.p2.x - this.p1.x;
                let dy = this.p2.y - this.p1.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 0.1) return;

                // Hooke's law force between vertices
                let force = (dist - this.restLength) * (stiffness * 0.035);
                let nx = dx / dist;
                let ny = dy / dist;

                let fx = nx * force;
                let fy = ny * force;

                this.p1.vx += fx;
                this.p1.vy += fy;
                this.p2.vx -= fx;
                this.p2.vy -= fy;
            }
        }

        function initMesh() {
            points = [];
            springs = [];

            let meshW = 460;
            let meshH = 307;
            let startX = (width - meshW) / 2;
            let startY = (height - meshH) / 2;

            // 1. Create Points within Rabbit Bounds
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let px = startX + (c / (cols - 1)) * meshW;
                    let py = startY + (r / (rows - 1)) * meshH;
                    points.push(new MeshPoint(px, py));
                }
            }

            // 2. Connect Neighbor Springs
            // Horizontal structural
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols - 1; c++) {
                    let i1 = r * cols + c;
                    let i2 = r * cols + (c + 1);
                    let dist = Math.sqrt(Math.pow(points[i1].x - points[i2].x, 2) + Math.pow(points[i1].y - points[i2].y, 2));
                    springs.push(new Spring(points[i1], points[i2], dist));
                }
            }
            // Vertical structural
            for (let r = 0; r < rows - 1; r++) {
                for (let c = 0; c < cols; c++) {
                    let i1 = r * cols + c;
                    let i2 = (r + 1) * cols + c;
                    let dist = Math.sqrt(Math.pow(points[i1].x - points[i2].x, 2) + Math.pow(points[i1].y - points[i2].y, 2));
                    springs.push(new Spring(points[i1], points[i2], dist));
                }
            }
            // Diagonal structural shear (prevents shearing/sliding collapse)
            for (let r = 0; r < rows - 1; r++) {
                for (let c = 0; c < cols - 1; c++) {
                    let i1 = r * cols + c;
                    let i2 = (r + 1) * cols + (c + 1);
                    let dist = Math.sqrt(Math.pow(points[i1].x - points[i2].x, 2) + Math.pow(points[i1].y - points[i2].y, 2));
                    springs.push(new Spring(points[i1], points[i2], dist));

                    let i3 = r * cols + (c + 1);
                    let i4 = (r + 1) * cols + c;
                    let dist2 = Math.sqrt(Math.pow(points[i3].x - points[i4].x, 2) + Math.pow(points[i3].y - points[i4].y, 2));
                    springs.push(new Spring(points[i3], points[i4], dist2));
                }
            }
            // Bending constraints (distance 2 connections for structural bulk shape recovery)
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols - 2; c++) {
                    let i1 = r * cols + c;
                    let i2 = r * cols + (c + 2);
                    let dist = Math.sqrt(Math.pow(points[i1].x - points[i2].x, 2) + Math.pow(points[i1].y - points[i2].y, 2));
                    springs.push(new Spring(points[i1], points[i2], dist));
                }
            }
            for (let r = 0; r < rows - 2; r++) {
                for (let c = 0; c < cols; c++) {
                    let i1 = r * cols + c;
                    let i2 = (r + 2) * cols + c;
                    let dist = Math.sqrt(Math.pow(points[i1].x - points[i2].x, 2) + Math.pow(points[i1].y - points[i2].y, 2));
                    springs.push(new Spring(points[i1], points[i2], dist));
                }
            }
        }

        function deformMesh(mx, my, force) {
            let maxRadius = width * 0.3;
            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                let dx = p.x - mx;
                let dy = p.y - my;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < maxRadius) {
                    let weight = 1 - (dist / maxRadius);
                    let angle = Math.atan2(dy, dx);
                    p.vx += Math.cos(angle) * force * weight * 16;
                    p.vy += Math.sin(angle) * force * weight * 16;
                }
            }
        }

        function toggleAdvancedSettings() {
            const el = document.getElementById('advanced-drawer');
            el.style.display = el.style.display === 'flex' ? 'none' : 'flex';

        function openPop(id) {
            document.querySelectorAll('.pop-overlay').forEach(el => el.style.display = 'none');
            const el = document.getElementById(id);
            if (el) el.style.display = 'flex';

        function closePop(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = 'none';
        }

        function selectBaseCard(baseId, emoji, cardId) {
            activeBase = baseId;
            activeEmoji = emoji;
            showNotification(`${emoji} ` + i18n.t('notif-char-loaded-base'));

            document.querySelectorAll('#character-pop .grid-card').forEach(el => el.classList.remove('active'));
            document.getElementById(cardId).classList.add('active');
            closePop('character-pop');
        }

        function importFromCameraCard(cardId) {
            document.getElementById('camera-input').click();
            
            document.querySelectorAll('#character-pop .grid-card').forEach(el => el.classList.remove('active'));
            document.getElementById(cardId).classList.add('active');
            closePop('character-pop');
        }

        function handleCameraUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    processImageToJelly(img);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processImageToJelly(img) {
            const size = 512;
            
            // Canvas A: Original Image centered with margin
            const imgCanvas = document.createElement('canvas');
            imgCanvas.width = size;
            imgCanvas.height = size;
            const imgCtx = imgCanvas.getContext('2d');
            
            // Scale down to fit with margin for the gel border
            const margin = 45;
            const fitSize = size - margin * 2;
            const scale = Math.min(fitSize / img.naturalWidth, fitSize / img.naturalHeight);
            const w = img.naturalWidth * scale;
            const h = img.naturalHeight * scale;
            const x = (size - w) / 2;
            const y = (size - h) / 2;
            imgCtx.drawImage(img, x, y, w, h);

            // Highly reliable flood-fill background keyer with gap-closing morphological outline dilation
            // (prevents keying out internal white body spaces even if outlines have gaps)
            const imgData = imgCtx.getImageData(0, 0, size, size);
            const pixels = imgData.data;

            // 1. Mark non-white/colored pixels as outline boundaries
            const solidOutline = new Uint8Array(size * size);
            for (let i = 0; i < pixels.length; i += 4) {
                const r = pixels[i];
                const g = pixels[i+1];
                const b = pixels[i+2];
                const a = pixels[i+3];
                // Non-transparent and not near white/light grey
                if (a > 50 && (r < 220 || g < 220 || b < 220)) {
                    solidOutline[i / 4] = 1;
                }
            }

            // 2. Perform morphological dilation on outline to seal any tiny line gaps (radius = 3)
            const closedOutline = new Uint8Array(size * size);
            const r_dilate = 3;
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (solidOutline[y * size + x]) {
                        for (let dy = -r_dilate; dy <= r_dilate; dy++) {
                            const ny = y + dy;
                            if (ny >= 0 && ny < size) {
                                for (let dx = -r_dilate; dx <= r_dilate; dx++) {
                                    const nx = x + dx;
                                    if (nx >= 0 && nx < size) {
                                        closedOutline[ny * size + nx] = 1;
                                    }
                                }
                            }
                        }
                    }
                }
            }

            // 3. Setup flood-fill traversal from outer canvas borders
            const visited = new Uint8Array(size * size);
            const queue = [];

            function isBackgroundCandidate(x, y) {
                const idx = y * size + x;
                if (closedOutline[idx]) return false; // Blocked by closed outline wall

                const pIdx = idx * 4;
                const r = pixels[pIdx];
                const g = pixels[pIdx+1];
                const b = pixels[pIdx+2];
                const a = pixels[pIdx+3];
                return a < 45 || (r > 220 && g > 220 && b > 220);
            }

            // Seed queue along borders
            for (let x = 0; x < size; x++) {
                if (!visited[x] && isBackgroundCandidate(x, 0)) {
                    visited[x] = 1;
                    queue.push(x);
                }
                const yBottom = size - 1;
                const idxBottom = yBottom * size + x;
                if (!visited[idxBottom] && isBackgroundCandidate(x, yBottom)) {
                    visited[idxBottom] = 1;
                    queue.push(idxBottom);
                }
            }
            for (let y = 0; y < size; y++) {
                const idxLeft = y * size;
                if (!visited[idxLeft] && isBackgroundCandidate(0, y)) {
                    visited[idxLeft] = 1;
                    queue.push(idxLeft);
                }
                const xRight = size - 1;
                const idxRight = y * size + xRight;
                if (!visited[idxRight] && isBackgroundCandidate(xRight, y)) {
                    visited[idxRight] = 1;
                    queue.push(idxRight);
                }
            }

            // 4. BFS traversal
            let head = 0;
            while (head < queue.length) {
                const curr = queue[head++];
                const cx = curr % size;
                const cy = Math.floor(curr / size);

                // Make background pixel transparent
                const idx = curr * 4;
                pixels[idx + 3] = 0;

                const neighbors = [
                    {x: cx + 1, y: cy},
                    {x: cx - 1, y: cy},
                    {x: cx, y: cy + 1},
                    {x: cx, y: cy - 1}
                ];

                for (let i = 0; i < neighbors.length; i++) {
                    const nx = neighbors[i].x;
                    const ny = neighbors[i].y;
                    if (nx >= 0 && nx < size && ny >= 0 && ny < size) {
                        const nIdx = ny * size + nx;
                        if (!visited[nIdx] && isBackgroundCandidate(nx, ny)) {
                            visited[nIdx] = 1;
                            queue.push(nIdx);
                        }
                    }
                }
            }

            imgCtx.putImageData(imgData, 0, 0);

            // Canvas B: Silhouette (Solid White)
            const silCanvas = document.createElement('canvas');
            silCanvas.width = size;
            silCanvas.height = size;
            const silCtx = silCanvas.getContext('2d');
            silCtx.drawImage(imgCanvas, 0, 0);
            silCtx.globalCompositeOperation = 'source-in';
            silCtx.fillStyle = 'white';
            silCtx.fillRect(0, 0, size, size);

            // Canvas C: Dilated Mask (Outer contour shape)
            const maskCanvas = document.createElement('canvas');
            maskCanvas.width = size;
            maskCanvas.height = size;
            const maskCtx = maskCanvas.getContext('2d');
            
            // Dilation via radial offset drawing to create consistent boundary padding
            const padRadius = 24; 
            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 8) {
                const dx = Math.cos(angle) * padRadius;
                const dy = Math.sin(angle) * padRadius;
                maskCtx.drawImage(silCanvas, dx, dy);
            }
            maskCtx.drawImage(silCanvas, 0, 0); // Fill center gaps

            // Canvas D: Shading & Gel effects
            const shadingCanvas = document.createElement('canvas');
            shadingCanvas.width = size;
            shadingCanvas.height = size;
            const shadCtx = shadingCanvas.getContext('2d');

            // Draw base shape
            shadCtx.drawImage(maskCanvas, 0, 0);
            
            // Tint base jelly color
            shadCtx.globalCompositeOperation = 'source-in';
            shadCtx.fillStyle = 'rgba(255, 100, 130, 0.28)'; // Soft gel tint
            shadCtx.fillRect(0, 0, size, size);

            // Shading inside the contour shape
            shadCtx.globalCompositeOperation = 'source-over';
            
            // 1. Dark Inner Shadow (Dome Bevel matching the character shape outline)
            const shadowCanvas = document.createElement('canvas');
            shadowCanvas.width = size;
            shadowCanvas.height = size;
            const shadowCtx = shadowCanvas.getContext('2d');
            shadowCtx.shadowColor = 'rgba(0, 0, 0, 0.7)';
            shadowCtx.shadowBlur = 30;
            shadowCtx.shadowOffsetX = -14;
            shadowCtx.shadowOffsetY = -14;
            shadowCtx.drawImage(maskCanvas, -14, -14);
            shadowCtx.globalCompositeOperation = 'destination-in';
            shadowCtx.drawImage(maskCanvas, 0, 0);
            
            shadCtx.drawImage(shadowCanvas, 0, 0);

            // 2. Light Inner Glow (Bottom-Right refractive light glow)
            const glowCanvas = document.createElement('canvas');
            glowCanvas.width = size;
            glowCanvas.height = size;
            const glowCtx = glowCanvas.getContext('2d');
            glowCtx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            glowCtx.shadowBlur = 18;
            glowCtx.shadowOffsetX = 10;
            glowCtx.shadowOffsetY = 10;
            glowCtx.drawImage(maskCanvas, 10, 10);
            glowCtx.globalCompositeOperation = 'destination-in';
            glowCtx.drawImage(maskCanvas, 0, 0);
            
            shadCtx.drawImage(glowCanvas, 0, 0);

            // 3. Multi-source Specular Highlights
            shadCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            shadCtx.beginPath();
            shadCtx.ellipse(size * 0.32, size * 0.32, size * 0.12, size * 0.055, Math.PI / 4, 0, Math.PI * 2);
            shadCtx.fill();

            shadCtx.fillStyle = 'rgba(255, 255, 255, 0.88)';
            shadCtx.beginPath();
            shadCtx.arc(size * 0.46, size * 0.22, size * 0.022, 0, Math.PI * 2);
            shadCtx.fill();

            shadCtx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            shadCtx.beginPath();
            shadCtx.ellipse(size * 0.22, size * 0.44, size * 0.05, size * 0.016, Math.PI / 3, 0, Math.PI * 2);
            shadCtx.fill();

            // Canvas E: Final Composited Texture
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = size;
            finalCanvas.height = size;
            const finalCtx = finalCanvas.getContext('2d');

            // Draw shading base gel backing
            finalCtx.drawImage(shadingCanvas, 0, 0);
            
            // Draw original image on top of gel
            finalCtx.drawImage(imgCanvas, 0, 0);

            // Update the active texture
            jellyImage.onload = function() {
                activeEmoji = '📷';
                activeBase = 'camera_face';
                
                // Re-init mesh boundary coordinates for the new silhouette mask
                initMesh();
                
                // Generate matching background jellies (using pink/red cherry tone 355)
                generateDecoJellies(355);
                
                // Transition: Go to playground stage
                setScreenMode('playground');
                showNotification(i18n.t('notif-silhouette-mapping'));
            };
            jellyImage.src = finalCanvas.toDataURL('image/png');
        }

        // Volumetric 3D Gummy shapes definitions
        let decoJellies = [];

        function generateDecoJellies(baseHue) {
            decoJellies = [];
            // Generate 45 to 60 background jellies for a packed background look
            const count = 45 + Math.floor(Math.random() * 15);
            for (let i = 0; i < count; i++) {
                // Distribute in zones to prevent them from being hidden under the center character mesh:
                // Zone 0: Left side, Zone 1: Right side, Zone 2: Top area, Zone 3: Bottom area
                const zone = Math.floor(Math.random() * 4);
                let x = 0;
                let y = 0;
                
                if (zone === 0) { // Left strip
                    x = 10 + Math.random() * 75;
                    y = 90 + Math.random() * (height - 180);
                } else if (zone === 1) { // Right strip
                    x = width - 85 - Math.random() * 75;
                    y = 90 + Math.random() * (height - 180);
                } else if (zone === 2) { // Top strip
                    x = 20 + Math.random() * (width - 40);
                    y = 90 + Math.random() * 140;
                } else { // Bottom strip
                    x = 20 + Math.random() * (width - 40);
                    y = height - 260 + Math.random() * 190;
                }

                // Size variation (from 24px to 58px) to create depth
                const size = 24 + Math.random() * 34; 
                
                // Hue variation around the base hue (with occasional random pops of complementary hues to look delicious!)
                let hue = (baseHue - 45 + Math.random() * 90 + 360) % 360;
                if (Math.random() < 0.15) {
                    // 15% chance to have a contrasting rainbow color for variety
                    hue = Math.floor(Math.random() * 360);
                }

                const phase = Math.random() * Math.PI * 2;
                const angle = (Math.random() - 0.5) * 1.0;
                
                const types = ['bear', 'heart', 'drop'];
                const type = types[Math.floor(Math.random() * types.length)];
                
                decoJellies.push({ type, x, y, size, hue, angle, phase });
            }
        }

        // Initialize with Strawberry red theme on start
        generateDecoJellies(350);

        function draw3DGummyBear(ctx, x, y, size, hue, angle, time, phase) {
            ctx.save();
            ctx.translate(x, y + Math.sin(time + phase) * 8);
            ctx.rotate(angle + Math.sin(time + phase) * 0.05);

            // 1. Dropshadow (3D ambient occlusion)
            ctx.shadowColor = 'rgba(0, 0, 0, 0.26)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 11;

            // Define main silhouette path
            let bearPath = () => {
                ctx.beginPath();
                ctx.arc(0, -size * 0.12, size * 0.3, 0, Math.PI * 2);
                ctx.arc(-size * 0.24, -size * 0.36, size * 0.12, 0, Math.PI * 2);
                ctx.arc(size * 0.24, -size * 0.36, size * 0.12, 0, Math.PI * 2);
                ctx.ellipse(0, size * 0.25, size * 0.34, size * 0.42, 0, 0, Math.PI * 2);
                ctx.ellipse(-size * 0.32, size * 0.12, size * 0.12, size * 0.2, Math.PI / 6, 0, Math.PI * 2);
                ctx.ellipse(size * 0.32, size * 0.12, size * 0.12, size * 0.2, -Math.PI / 6, 0, Math.PI * 2);
                ctx.ellipse(-size * 0.24, size * 0.6, size * 0.15, size * 0.2, -Math.PI / 12, 0, Math.PI * 2);
                ctx.ellipse(size * 0.24, size * 0.6, size * 0.15, size * 0.2, Math.PI / 12, 0, Math.PI * 2);
                ctx.closePath();
            };

            bearPath();

            // 2. Translucent volumetric radial gradient (hot center glow to dark saturated border)
            let grad = ctx.createRadialGradient(-size * 0.12, -size * 0.12, size * 0.05, 0, size * 0.1, size * 0.72);
            grad.addColorStop(0, `hsla(${hue}, 100%, 82%, 0.98)`); // center core glow
            grad.addColorStop(0.6, `hsla(${hue}, 100%, 50%, 0.95)`); // syrup body
            grad.addColorStop(1, `hsla(${hue}, 100%, 24%, 1)`); // saturated rim
            ctx.fillStyle = grad;
            ctx.fill();

            // Disable standard canvas shadow for overlays
            ctx.shadowColor = 'transparent';

            // 3. Subsurface scattering (opposite bottom-right warm translucency glow)
            ctx.save();
            bearPath();
            ctx.clip();
            let subGrad = ctx.createRadialGradient(size * 0.2, size * 0.38, 0, size * 0.16, size * 0.32, size * 0.44);
            subGrad.addColorStop(0, `hsla(${(hue + 20) % 360}, 100%, 76%, 0.55)`); // warm secondary light collection
            subGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = subGrad;
            ctx.fill();
            ctx.restore();

            // 4. Glossy Inner Bevel Highlight
            ctx.save();
            bearPath();
            ctx.clip();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = size * 0.07;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.75)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = -size * 0.04;
            ctx.shadowOffsetY = -size * 0.04;
            ctx.stroke();
            ctx.restore();

            // 5. Draw detailed volumetric facial/belly features
            // Snout
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.12, size * 0.12, size * 0.08, 0, 0, Math.PI * 2);
            let snoutGrad = ctx.createLinearGradient(0, -size * 0.2, 0, -size * 0.04);
            snoutGrad.addColorStop(0, `hsla(${hue}, 100%, 88%, 0.9)`);
            snoutGrad.addColorStop(1, `hsla(${hue}, 95%, 48%, 0.9)`);
            ctx.fillStyle = snoutGrad;
            ctx.fill();

            // Nose
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.14, size * 0.05, 0.03 * size, 0, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${hue}, 100%, 20%, 0.8)`;
            ctx.fill();

            // Eyes
            ctx.fillStyle = `hsla(${hue}, 100%, 16%, 0.75)`;
            ctx.beginPath();
            ctx.arc(-size * 0.1, -size * 0.2, size * 0.03, 0, Math.PI * 2);
            ctx.arc(size * 0.1, -size * 0.2, size * 0.03, 0, Math.PI * 2);
            ctx.fill();

            // Belly round highlight
            ctx.beginPath();
            ctx.ellipse(0, size * 0.25, size * 0.22, size * 0.26, 0, 0, Math.PI * 2);
            let bellyGrad = ctx.createRadialGradient(0, size * 0.2, 0, 0, size * 0.25, size * 0.26);
            bellyGrad.addColorStop(0, `hsla(${hue}, 100%, 80%, 0.45)`);
            bellyGrad.addColorStop(1, `hsla(${hue}, 95%, 40%, 0.05)`);
            ctx.fillStyle = bellyGrad;
            ctx.fill();

            // 6. Sour sugar-frosted crystalline coating rendering
            ctx.save();
            bearPath();
            ctx.clip();
            let seed = phase * 120;
            function randomSeeded() {
                let x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            }
            for (let i = 0; i < 95; i++) {
                let px = (randomSeeded() - 0.5) * size * 1.5;
                let py = (randomSeeded() - 0.5) * size * 1.6;
                let w = 1.0 + randomSeeded() * 1.8;
                let h = 1.0 + randomSeeded() * 1.8;
                let alpha = 0.35 + randomSeeded() * 0.65;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fillRect(px, py, w, h);
            }
            ctx.restore();

            // 7. Multi-point Studio Specular Highlights
            ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
            
            // Forehead capsule reflection
            ctx.beginPath();
            ctx.ellipse(-size * 0.08, -size * 0.22, size * 0.07, size * 0.03, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Snout specular spot
            ctx.beginPath();
            ctx.ellipse(-size * 0.03, -size * 0.15, size * 0.03, size * 0.015, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Left ear capsule reflection
            ctx.beginPath();
            ctx.ellipse(-size * 0.24, -size * 0.41, size * 0.05, size * 0.02, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Belly major highlight
            ctx.beginPath();
            ctx.ellipse(-size * 0.08, size * 0.14, size * 0.1, size * 0.04, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Sharp dot reflection adjacent to primary
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-size * 0.02, -size * 0.24, size * 0.018, 0, Math.PI * 2);
            ctx.fill();

            // Secondary bounce light rim reflection (opposite bottom-right)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.38)';
            ctx.beginPath();
            ctx.ellipse(size * 0.18, size * 0.45, size * 0.12, size * 0.03, -Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function draw3DGummyHeart(ctx, x, y, size, hue, angle, time, phase) {
            ctx.save();
            ctx.translate(x, y + Math.sin(time + phase) * 8);
            ctx.rotate(angle + Math.sin(time + phase) * 0.05);

            // 1. Dropshadow (3D ambient occlusion)
            ctx.shadowColor = 'rgba(0, 0, 0, 0.26)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 11;

            let w = size * 1.15;
            let h = size;

            let heartPath = () => {
                ctx.beginPath();
                ctx.moveTo(0, h * 0.35);
                ctx.bezierCurveTo(-w * 0.5, -h * 0.4, -w * 0.95, h * 0.1, 0, h * 0.85);
                ctx.bezierCurveTo(w * 0.95, h * 0.1, w * 0.5, -h * 0.4, 0, h * 0.35);
                ctx.closePath();
            };

            heartPath();

            // 2. Translucent radial gradient
            let grad = ctx.createRadialGradient(-size * 0.12, -size * 0.12, size * 0.05, 0, h * 0.2, size * 0.72);
            grad.addColorStop(0, `hsla(${hue}, 100%, 82%, 0.98)`); // center core glow
            grad.addColorStop(0.6, `hsla(${hue}, 100%, 50%, 0.95)`); // syrup body
            grad.addColorStop(1, `hsla(${hue}, 100%, 24%, 1)`); // saturated rim
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.shadowColor = 'transparent';

            // 3. Subsurface scattering (opposite bottom-right warm translucency glow)
            ctx.save();
            heartPath();
            ctx.clip();
            let subGrad = ctx.createRadialGradient(size * 0.22, h * 0.42, 0, size * 0.18, h * 0.38, size * 0.46);
            subGrad.addColorStop(0, `hsla(${(hue + 20) % 360}, 100%, 76%, 0.55)`);
            subGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = subGrad;
            ctx.fill();
            ctx.restore();

            // 4. Glossy Inner Bevel Highlight
            ctx.save();
            heartPath();
            ctx.clip();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = size * 0.07;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.75)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = -size * 0.04;
            ctx.shadowOffsetY = -size * 0.04;
            ctx.stroke();
            ctx.restore();

            // 5. Volume bevel inner shine
            ctx.beginPath();
            ctx.ellipse(0, h * 0.3, size * 0.3, size * 0.2, 0, 0, Math.PI * 2);
            let bellyGrad = ctx.createRadialGradient(0, h * 0.25, 0, 0, h * 0.3, size * 0.25);
            bellyGrad.addColorStop(0, `hsla(${hue}, 100%, 80%, 0.45)`);
            bellyGrad.addColorStop(1, `hsla(${hue}, 95%, 40%, 0.05)`);
            ctx.fillStyle = bellyGrad;
            ctx.fill();

            // 6. Sour sugar-frosted crystalline coating rendering
            ctx.save();
            heartPath();
            ctx.clip();
            let seed = phase * 120;
            function randomSeeded() {
                let x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            }
            for (let i = 0; i < 95; i++) {
                let px = (randomSeeded() - 0.5) * w * 1.6;
                let py = (randomSeeded() - 0.2) * h * 1.6;
                let rw = 1.0 + randomSeeded() * 1.8;
                let rh = 1.0 + randomSeeded() * 1.8;
                let alpha = 0.35 + randomSeeded() * 0.65;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fillRect(px, py, rw, rh);
            }
            ctx.restore();

            // 7. Multi-point Specular highlights
            ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
            
            // Left lobe highlight capsule
            ctx.beginPath();
            ctx.ellipse(-w * 0.22, -h * 0.12, size * 0.16, size * 0.06, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Right lobe highlight spot
            ctx.beginPath();
            ctx.ellipse(w * 0.22, -h * 0.12, size * 0.06, size * 0.03, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Sharp dot reflection adjacent to primary
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-w * 0.14, -h * 0.16, size * 0.018, 0, Math.PI * 2);
            ctx.fill();

            // Secondary bounce reflection rim (opposite bottom-right)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.38)';
            ctx.beginPath();
            ctx.ellipse(w * 0.18, h * 0.35, size * 0.16, size * 0.04, -Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function draw3DGummyDrop(ctx, x, y, size, hue, angle, time, phase) {

            let grad = ctx.createRadialGradient(-size * 0.12, -size * 0.12, size * 0.05, 0, 0, size * 0.5);

            subGrad.addColorStop(0, `hsla(${(hue + 20) % 360}, 100%, 76%, 0.55)`);

            // 4. Glossy Inner Bevel Highlight

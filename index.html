                    countdownInterval = null;
                    const countdown = document.getElementById('countdown-overlay');
                    if (countdown) countdown.style.display = 'none';
                }
                return;
            }

            isRecording = false;
            
            if (recordingTimerInterval) {
                clearInterval(recordingTimerInterval);
                recordingTimerInterval = null;
            }

            // Hide recording pill
            const pill = document.getElementById('recording-indicator');
            if (pill) pill.style.display = 'none';

            // Reset icon back to video symbol (📹)
            const globalBtn = document.getElementById('global-rec-btn');
            if (globalBtn) { 
                globalBtn.innerHTML = '<img src="movie.png" alt="녹화" style="width: 32px; height: 32px; object-fit: contain;">'; 
                globalBtn.title = i18n.t('btn-rec'); 
            }

            // Stop Canvas recording
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try {
                    mediaRecorder.stop();
                } catch (e) {
                    console.error("Error stopping media recorder:", e);
                }
            }

            openResultModal();
            showNotification(i18n.t('notif-rec-complete'));
        }

        function openResultModal() {
            document.getElementById('result-modal').style.display = 'flex';
        }

        function closeResultModal() {
            document.getElementById('result-modal').style.display = 'none';
            const previewVideo = document.getElementById('result-video-preview');
            if (previewVideo) {
                previewVideo.src = '';
            }
        }

        function saveToGallery() {
            if (!lastRecordedBlob) {
                showNotification("No recorded video found.");
                return;
            }
            closeResultModal();
            
            let ext = 'webm';
            let mime = 'video/webm';
            if (lastRecordedBlob.type.includes('mp4')) {
                ext = 'mp4';
                mime = 'video/mp4';
            } else if (lastRecordedBlob.type.includes('quicktime')) {
                ext = 'mov';
                mime = 'video/quicktime';
            }

            const filename = `squishy-rabbit-${Date.now()}.${ext}`;
            const file = new File([lastRecordedBlob], filename, { type: mime });

            // 📱 Web Share API support check (highly reliable for mobile gallery saving/sharing)
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({
                    files: [file],
                    title: 'Fruitrabbit Malrangi Video',
                    text: 'Check out my squishy rabbit video!'
                }).then(() => {
                    showNotification(i18n.t('notif-gallery-saved'));
                }).catch(err => {
                    console.log("Web share failed, fallback to download:", err);
                    triggerDirectDownload(filename);
                });
            } else {
                triggerDirectDownload(filename);
            }
        }

        function triggerDirectDownload(filename) {
            const url = URL.createObjectURL(lastRecordedBlob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 150);
            showNotification(i18n.t('notif-gallery-saved'));
        }

        function showNotification(msg) {
            console.log(msg);
            const toast = document.getElementById('toast-el');
            if (!toast) return;
            toast.innerText = msg;
            toast.classList.add('active');
            
            if (window.toastTimeout) clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.classList.remove('active');
            }, 2500);
        }

        function drawWarpedTriangle(ctx, img, p0, p1, p2, imgW, imgH) {
            let targetW = 460;
            let targetH = 307;
            let startX = (width - targetW) / 2;
            let startY = (height - targetH) / 2;

            // Crop 5% left/right and 4% top/bottom margins to give a perfect size
            let cropX0 = 0.05 * imgW;
            let cropX1 = 0.95 * imgW;
            let cropY0 = 0.04 * imgH;
            let cropY1 = 0.96 * imgH;

            let u0 = cropX0 + ((p0.ox - startX) / targetW) * (cropX1 - cropX0);
            let v0 = cropY0 + ((p0.oy - startY) / targetH) * (cropY1 - cropY0);
            let u1 = cropX0 + ((p1.ox - startX) / targetW) * (cropX1 - cropX0);
            let v1 = cropY0 + ((p1.oy - startY) / targetH) * (cropY1 - cropY0);
            let u2 = cropX0 + ((p2.ox - startX) / targetW) * (cropX1 - cropX0);
            let v2 = cropY0 + ((p2.oy - startY) / targetH) * (cropY1 - cropY0);

            let x0 = p0.x;
            let y0 = p0.y;
            let x1 = p1.x;
            let y1 = p1.y;
            let x2 = p2.x;
            let y2 = p2.y;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.closePath();
            ctx.clip();

            // Solve affine matrix: u * A + B = x
            let denom = u0 * (v1 - v2) + u1 * (v2 - v0) + u2 * (v0 - v1);
            if (Math.abs(denom) < 0.1) {
                ctx.restore();
                return;
            }

            let a = (x0 * (v1 - v2) + x1 * (v2 - v0) + x2 * (v0 - v1)) / denom;
            let b = (y0 * (v1 - v2) + y1 * (v2 - v0) + y2 * (v0 - v1)) / denom;
            let c = (x0 * (u2 - u1) + x1 * (u0 - u2) + x2 * (u1 - u0)) / denom;
            let d = (y0 * (u2 - u1) + y1 * (u0 - u2) + y2 * (u1 - u0)) / denom;
            let e = x0 - a * u0 - c * v0;
            let f = y0 - b * u0 - d * v0;

            ctx.transform(a, b, c, d, e, f);
            ctx.drawImage(img, 0, 0);
            ctx.restore();
        }

        // Draw loop
        let lastDrawErrorTime = 0;
        
        function draw() {
            try {
                ctx.clearRect(0, 0, width, height);

                // Dynamic theme-matched background gradient
                let bgGrad = ctx.createLinearGradient(0, 0, 0, height);
                bgGrad.addColorStop(0, `hsla(${activeHue}, 75%, 90%, 1)`); // soft pastel top
                bgGrad.addColorStop(1, `hsla(${activeHue}, 65%, 78%, 1)`); // slightly richer bottom
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, width, height);

                // Draw floating decorative background jellies
                drawDecoJellies();

                // 1. Solve springs (8 substeps for instant force propagation across the entire mesh)
                for (let step = 0; step < 8; step++) {
                    for (let i = 0; i < springs.length; i++) {
                        springs[i].solve();
                    }
                }

                // 2. Pin grabbed point and apply continuous touch hold squish forces
                if (isTouching) {
                    if (grabbedPointIndex !== null && points[grabbedPointIndex]) {
                        points[grabbedPointIndex].x = touchX;
                        points[grabbedPointIndex].y = touchY;
                        points[grabbedPointIndex].vx = 0;
                        points[grabbedPointIndex].vy = 0;
                        
                        touchHapticFrame++;
                        // Trigger a haptic pulse every 12 frames (~200ms at 60fps)
                        if (touchHapticFrame % 12 === 0) {
                            // Alternate between strong (35ms) and weak (12ms) vibration
                            const isStrong = (Math.floor(touchHapticFrame / 12) % 2 === 0);
                            const duration = isStrong ? 35 : 12;
                            if (navigator.vibrate) {
                                navigator.vibrate(duration);
                            }
                        }
                    } else {
                        touchHapticFrame = 0;
                    }
                    
                    touchTime = Math.min(touchTime + 1, 120);
                    // Moderate and progressive build up (charged in 45 frames, up to 1.5)
                    let squishIntensity = Math.min(touchTime / 25, 2.5);
                    let squishForce = squishIntensity * 14.0;
                    let maxDist = width * 0.55;
                    
                    for (let i = 0; i < points.length; i++) {
                        let p = points[i];
                        let dx = p.x - touchX;
                        let dy = p.y - touchY;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < maxDist && dist > 1) {
                            let weight = 1 - (dist / maxDist);
                            let angle = Math.atan2(dy, dx);
                            
                            // 1. Radial outward indentation
                            let forceX = Math.cos(angle) * squishForce * weight * 85;
                            let forceY = Math.sin(angle) * squishForce * weight * 75;
                            
                            // 2. Horizontal expansion (bulging sides out)
                            forceX += (dx / dist) * squishForce * weight * 45;
                            
                            // 3. Vertical compression (flattens down)
                            forceY -= (dy / dist) * squishForce * weight * 30;
                            
                            // 4. DRAMATIC DEEP DOWNWARD SINK FORCE (sinks character deep into background!)
                            forceY += squishForce * weight * 180;
                            
                            p.vx += forceX;
                            p.vy += forceY;
                        }
                    }
                } else {
                    touchHapticFrame = 0;
                }

                // 3. Update mesh points
                for (let i = 0; i < points.length; i++) {
                    points[i].update();
                }

                // Draw a realistic 3D contact ambient occlusion shadow underneath the main character
                let centerIndex = Math.floor(rows / 2) * cols + Math.floor(cols / 2);
                if (points.length > centerIndex && points[centerIndex]) {
                    let center = points[centerIndex];
                    
                    ctx.save();
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
                    ctx.filter = 'blur(12px)';
                    ctx.beginPath();
                    ctx.ellipse(center.x, center.y + 120, 180, 45, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // Draw jelly mesh body
                    if (jellyImage.complete && jellyImage.naturalWidth > 0) {
                        for (let r = 0; r < rows - 1; r++) {
                            for (let c = 0; c < cols - 1; c++) {
                                let pTL = points[r * cols + c];
                                let pTR = points[r * cols + (c + 1)];
                                let pBL = points[(r + 1) * cols + c];
                                let pBR = points[(r + 1) * cols + (c + 1)];

                                if (pTL && pTR && pBL && pBR) {
                                    drawWarpedTriangle(ctx, jellyImage, pTL, pTR, pBL, jellyImage.naturalWidth, jellyImage.naturalHeight);
                                    drawWarpedTriangle(ctx, jellyImage, pTR, pBR, pBL, jellyImage.naturalWidth, jellyImage.naturalHeight);
                                }
                            }
                        }
                    } else {
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(center.x, center.y, 135, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = '#000';
                        ctx.font = '5.5rem Inter';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(activeEmoji, center.x, center.y);
                    }
                }
            } catch (err) {
                console.error("Draw loop error:", err);
                const nowTime = Date.now();
                if (nowTime - lastDrawErrorTime > 10000) { // Throttle notifications
                    showNotification("Draw Error: " + err.message);
                    lastDrawErrorTime = nowTime;
                }
            }

            requestAnimationFrame(draw);
        }

        function isPlaygroundActive() {
            const splash = document.getElementById('start-splash-screen');
            const lobby = document.getElementById('lobby-screen');
            const camera = document.getElementById('custom-camera-overlay');
            const resultModal = document.getElementById('result-modal');
            
            if (splash && !splash.classList.contains('fade-out')) {
                return false;
            }
            if (lobby && lobby.style.display !== 'none') {
                return false;
            }
            if (camera && camera.style.display === 'flex') {
                return false;
            }
            if (resultModal && resultModal.style.display === 'flex') {
                return false;
            }
            return true;
        }

        // Register mouse deforms with dynamic coordinate scaling and point grab lock
        canvas.addEventListener('mousedown', (e) => {
            if (!isPlaygroundActive()) return;
            stopAutopilot();
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;
            let mx = (e.clientX - rect.left) * scaleX;
            let my = (e.clientY - rect.top) * scaleY;
            
            // Find closest mesh node to drag
            let minDist = 99999;
            let closestIdx = -1;
            for (let i = 0; i < points.length; i++) {
                let d = Math.sqrt(Math.pow(points[i].x - mx, 2) + Math.pow(points[i].y - my, 2));
                if (d < minDist) {
                    minDist = d;
                    closestIdx = i;
                }
            }

            // Grab point if user clicked close enough
            if (minDist < width * 0.35) {
                grabbedPointIndex = closestIdx;
                playSquishSound(false);
                triggerHaptic(15);
            }
            
            isTouching = true;
            touchX = mx;
            touchY = my;
            touchTime = 0;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isPlaygroundActive()) return;
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;
            let mx = (e.clientX - rect.left) * scaleX;
            let my = (e.clientY - rect.top) * scaleY;

            if (e.buttons === 1 || grabbedPointIndex !== null) {
                touchX = mx;
                touchY = my;
                isTouching = true;
            }

            if (grabbedPointIndex !== null) {
                // Pin grabbed point directly to mouse cursor
                points[grabbedPointIndex].x = mx;
                points[grabbedPointIndex].y = my;
                points[grabbedPointIndex].vx = 0;
                points[grabbedPointIndex].vy = 0;
            } else if (e.buttons === 1) {
                deformMesh(mx, my, 15);
            }
        });

        let audioCtx = null;

        function playSquishSound(isRelease = false) {
            if (!isPlaygroundActive()) return; // Disable all interaction sound effects outside of playground
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (isRelease) {
                    // Popping spring-back release sound (quick pitch sweep up)
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(550, now + 0.12);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else {
                    // Soft rubber squishy grab sound (downward sweep)
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(90, now);
                    osc.frequency.linearRampToValueAtTime(140, now + 0.18);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.18);
                }
            } catch (e) {
                console.log("AudioContext blocked or not supported:", e);
            }
        }

        function triggerHaptic(ms) {
            if (!isPlaygroundActive()) return; // Disable physical feedback outside of playground
            if (navigator.vibrate) {
                navigator.vibrate(ms);
            }
        }

        function resetMesh() {
            for (let i = 0; i < points.length; i++) {
                points[i].x = points[i].ox;
                points[i].y = points[i].oy;
                points[i].vx = 0;
                points[i].vy = 0;
            }
        }

        const releaseGrab = () => {
            if (grabbedPointIndex !== null) {
                playSquishSound(true);
                triggerHaptic(30);
            }
            grabbedPointIndex = null;
            isTouching = false;
            touchTime = 0;
        };
        canvas.addEventListener('mouseup', releaseGrab);
        canvas.addEventListener('mouseleave', releaseGrab);

        // Mobile touch gesture bindings mapped dynamically to engine input
        const getTouchPos = (e) => {
            if (!e.touches || e.touches.length === 0) return null;
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;
            return {
                x: (e.touches[0].clientX - rect.left) * scaleX,
                y: (e.touches[0].clientY - rect.top) * scaleY
            };
        };

        canvas.addEventListener('touchstart', (e) => {
            if (!isPlaygroundActive()) return;
            stopAutopilot();
            e.preventDefault();
            let pos = getTouchPos(e);
            if (!pos) return;
            let minDist = 99999;
            let closestIdx = -1;
            for (let i = 0; i < points.length; i++) {
                let d = Math.sqrt(Math.pow(points[i].x - pos.x, 2) + Math.pow(points[i].y - pos.y, 2));
                if (d < minDist) {
                    minDist = d;
                    closestIdx = i;
                }
            }
            if (minDist < width * 0.35) {
                grabbedPointIndex = closestIdx;
                playSquishSound(false);
                triggerHaptic(15);
            }
            
            isTouching = true;
            touchX = pos.x;
            touchY = pos.y;
            touchTime = 0;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!isPlaygroundActive()) return;
            e.preventDefault();
            let pos = getTouchPos(e);
            if (!pos) return;
            touchX = pos.x;
            touchY = pos.y;
            isTouching = true;

            if (grabbedPointIndex !== null) {
                points[grabbedPointIndex].x = pos.x;
                points[grabbedPointIndex].y = pos.y;
                points[grabbedPointIndex].vx = 0;
                points[grabbedPointIndex].vy = 0;
            } else {
                deformMesh(pos.x, pos.y, 15);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            releaseGrab();
        }, { passive: false });

        let isAutopilotActive = false;
        let autopilotTimer = null;
        let autopilotPhase = 0; // 0: mousedown, 1: drag, 2: mouseup hold
        let autoMX = 0;
        let autoMY = 0;
        let autoDestX = 0;
        let autoDestY = 0;

        function toggleAutopilot() {
            const lobby = document.getElementById('lobby-screen');
            if (lobby.style.display !== 'none') {
                // If clicked in Lobby, auto-load current character and enter playground first
                const bubble = document.querySelectorAll('.grid-char-bubble')[activeLobbyIndex];
                selectLobbyCharacter(activeLobbyIndex, bubble);
                setTimeout(() => {
                    isAutopilotActive = true;
                    applyAutopilotUIState(true);
                    runAutopilotStep();
                }, 400);
                return;
            }

            // Normal toggle
            isAutopilotActive = !isAutopilotActive;
            applyAutopilotUIState(isAutopilotActive);
            if (isAutopilotActive) {
                runAutopilotStep();
            } else {
                if (autopilotTimer) clearTimeout(autopilotTimer);
                releaseGrab();
                resetMesh();
            }
        }

        function applyAutopilotUIState(active) {
            const btn = document.getElementById('autopilot-btn');
            if (active) {
                btn.style.borderColor = "#00d2ff";
                btn.style.background = "rgba(0, 210, 255, 0.25)";
                btn.style.boxShadow = "0 0 12px rgba(0, 210, 255, 0.5)";
            } else {
                btn.style.borderColor = "";
                btn.style.background = "";
                btn.style.boxShadow = "";
            }
        }

        function stopAutopilot() {
            if (isAutopilotActive) {
                isAutopilotActive = false;
                applyAutopilotUIState(false);
                if (autopilotTimer) clearTimeout(autopilotTimer);
                releaseGrab();
                resetMesh();
                showNotification(i18n.t('notif-auto-stop'));
            }
        }

        function runAutopilotStep() {
            if (!isAutopilotActive) return;

            let startX = (width - 330) / 2;
            let startY = (height - 220) / 2;

            if (autopilotPhase === 0) {
                // Pick a random grid point on the rabbit (skip borders to keep it centered)
                let randR = Math.floor(2 + Math.random() * (rows - 4));
                let randC = Math.floor(2 + Math.random() * (cols - 4));
                let randNode = points[randR * cols + randC];
                autoMX = randNode.x;
                autoMY = randNode.y;

                // Find closest point to lock grab
                let minDist = 99999;
                let closestIdx = -1;
                for (let i = 0; i < points.length; i++) {
                    let d = Math.sqrt(Math.pow(points[i].x - autoMX, 2) + Math.pow(points[i].y - autoMY, 2));
                    if (d < minDist) {
                        minDist = d;
                        closestIdx = i;
                    }
                }
                grabbedPointIndex = closestIdx;

                // Determine drag destination pulling outwards from center
                let dirX = autoMX - width / 2;
                let dirY = autoMY - height / 2;
                let len = Math.sqrt(dirX * dirX + dirY * dirY);
                if (len < 5) len = 5; // prevent division by zero
                autoDestX = autoMX + (dirX / len) * 85;
                autoDestY = autoMY + (dirY / len) * 85;

                isTouching = true;
                touchX = autoMX;
                touchY = autoMY;
                touchTime = 0;

                autopilotPhase = 1;
                autopilotTimer = setTimeout(runAutopilotStep, 100);
            } else if (autopilotPhase === 1) {
                // Drag the node smoothly
                autoMX += (autoDestX - autoMX) * 0.25;
                autoMY += (autoDestY - autoMY) * 0.25;

                isTouching = true;
                touchX = autoMX;
                touchY = autoMY;

                if (grabbedPointIndex !== null) {
                    points[grabbedPointIndex].x = autoMX;
                    points[grabbedPointIndex].y = autoMY;
                    points[grabbedPointIndex].vx = 0;
                    points[grabbedPointIndex].vy = 0;
                }

                let d = Math.sqrt(Math.pow(autoDestX - autoMX, 2) + Math.pow(autoDestY - autoMY, 2));
                if (d < 6) {
                    autopilotPhase = 2;
                    autopilotTimer = setTimeout(runAutopilotStep, 600); // hold stretch for 600ms
                } else {
                    autopilotTimer = setTimeout(runAutopilotStep, 25);
                }
            } else {
                // Release node (snap-back simulation)
                releaseGrab();
                autopilotPhase = 0;
                autopilotTimer = setTimeout(runAutopilotStep, 1000); // wait 1s before grabbing next spot
            }
        }

        // Custom camera streaming state variables
        let cameraStream = null;
        let cameraFacingMode = 'user'; // 'user' for front-facing, 'environment' for rear-facing
        let customPhotoCounter = 1;

        // Lobby Characters Database (20 Fruit Rabbits)
        const lobbyCharacters = [
            { emoji: '🍓', name: '딸기 토끼', base: 'strawberry_rabbit', hue: 350 },
            { emoji: '🍋', name: '레몬 토끼', base: 'lemon_rabbit', hue: 60 },

        function getTintedJellyDataURL(baseImg, hue) {
            try {
                const canvas = document.createElement('canvas');
                const size = 512;
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // 1. Draw base 3D glass jelly
                ctx.drawImage(baseImg, 0, 0, size, size);

                // If default strawberry (hue 350-355), return original base image without tint
                if (hue >= 345 && hue <= 360) {
                    return canvas.toDataURL('image/png');
                }

                // 2. Create hue tint canvas
                const tintCanvas = document.createElement('canvas');
                tintCanvas.width = size;
                tintCanvas.height = size;
                const tCtx = tintCanvas.getContext('2d');

                // Draw base image to keep alpha
                tCtx.drawImage(baseImg, 0, 0, size, size);

                // Blend hue overlay
                tCtx.globalCompositeOperation = 'source-in';
                tCtx.fillStyle = `hsl(${hue}, 85%, 55%)`;
                tCtx.fillRect(0, 0, size, size);

                // 3. Composite hue onto original 3D glass highlights
                const finalCanvas = document.createElement('canvas');
                finalCanvas.width = size;
                finalCanvas.height = size;
                const fCtx = finalCanvas.getContext('2d');

                fCtx.drawImage(baseImg, 0, 0, size, size);
                fCtx.globalCompositeOperation = 'hue';
                fCtx.drawImage(tintCanvas, 0, 0, size, size);

                // Restore sharp specular glass highlights
                fCtx.globalCompositeOperation = 'soft-light';
                fCtx.drawImage(baseImg, 0, 0, size, size);

                return finalCanvas.toDataURL('image/png');
            } catch (err) {
                console.error("getTintedJellyDataURL error:", err);
                return baseImg.src;
            }
        }
    
        function selectLobbyCharacter(index, element) {
            stopAutopilot();
            activeLobbyIndex = index;
            const char = lobbyCharacters[index];
            
            // Set character base, emoji, and theme hue in the simulation
            activeEmoji = char.emoji;
            activeBase = char.base;
            activeHue = char.hue;

            // If selecting Strawberry Rabbit, restore default strawberry drawing in jellyImage
            if (char.base === 'strawberry_rabbit' && defaultStrawberrySrc) {
                if (jellyImage.src !== defaultStrawberrySrc) {
                    jellyImage.src = defaultStrawberrySrc;
                }
            } else if (char.base.startsWith('custom_photo_') && char.imgData) {
                // Load saved custom photo jelly texture
                jellyImage.src = char.imgData;
            }
            
            // Reinitialize mesh to sync correctly
            initMesh();
            
            // Generate themed background jellies matching this character
            generateDecoJellies(char.hue);
            
            // Visual transition: Go to playground
            setScreenMode('playground');
            showNotification(getRabbitName(char) + ` ` + i18n.t('notif-char-loaded-play'));

            // Highlight selected bubble
            document.querySelectorAll('.grid-char-bubble').forEach(b => b.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            } else {
                const bubbles = document.querySelectorAll('.grid-char-bubble');
                if (bubbles[index]) {
                    bubbles[index].classList.add('active');
                }
            }
        }

        function selectFeelPill(feel) {
            stopAutopilot();
            activeFeel = feel;
            
            // Select active pill styling
            document.querySelectorAll('.feel-pill').forEach(pill => pill.classList.remove('active'));
            if (feel === 'jelly') {
                document.getElementById('pill-jelly').classList.add('active');
                stiffness = 50;
                damping = 8;
                showNotification(i18n.t('notif-jelly'));
            } else if (feel === 'mochi') {
                document.getElementById('pill-mochi').classList.add('active');
                stiffness = 120;
                damping = 22;
                showNotification(i18n.t('notif-mochi'));
            } else if (feel === 'slime') {
                document.getElementById('pill-slime').classList.add('active');
                stiffness = 22;
                damping = 2.5;
                showNotification(i18n.t('notif-slime'));
            }
            
            // Sync developers inputs
            document.getElementById('spring-stiffness').value = stiffness;
            document.getElementById('dampening').value = damping;
            syncSliderLabels();
        }

        function setScreenMode(mode) {
            const lobby = document.getElementById('lobby-screen');
            const btn = document.getElementById('global-home-exit-btn');

                lobby.style.display = 'flex';
                setTimeout(() => {
                    lobby.style.opacity = '1';
                }, 20);
                // In Lobby, display Exit button
                btn.innerHTML = '<img src="out.png" alt="나가기" style="width: 32px; height: 32px; object-fit: contain;">';
                btn.onclick = exitGame;
                btn.title = i18n.t('btn-exit');
            } else {
                lobby.style.opacity = '0';
                setTimeout(() => {
                    lobby.style.display = 'none';
                }, 300);
                // In Playground, display Home button to return
                btn.innerHTML = '<img src="home.png" alt="홈으로" style="width: 32px; height: 32px; object-fit: contain;">';
                btn.onclick = goBackToLobby;
                btn.title = i18n.t('btn-home');
            }
        }

        const bgmPlayer = {
            isPlaying: false,
            currentTrackIndex: 0,
            volume: 0.04, // default volume level
            gainNode: null,
            filterNode: null,
            timerId: null,
            melodyTimerId: null,
            chordStep: 0,
            
            tracks: [
                {
                    name: "Sunshine Strawberry",
                    chords: [
                        [261.63, 329.63, 392.00, 493.88], // Cmaj7 (C3, E3, G3, B3)
                        [196.00, 246.94, 293.66, 329.63], // G6 (G2, B2, D3, E3)
                        [220.00, 261.63, 329.63, 392.00], // Am7 (A2, C3, E3, G3)
                        [174.61, 261.63, 329.63, 440.00]  // Fmaj7 (F2, C3, E3, A3)
                    ],
                    melodyNotes: [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51], // C5, D5, E5, G5, A5, C6, D6, E6
                    tempo: 1600
                },
                {
                    name: "Joyful Peach",
                    chords: [
                        [220.00, 277.18, 329.63, 415.30], // Amaj7
                        [185.00, 220.00, 277.18, 329.63], // F#m7
                        [146.83, 220.00, 277.18, 369.99], // Dmaj7
                        [164.81, 220.00, 293.66, 329.63]  // E7sus4
                    ],
                    melodyNotes: [554.37, 659.25, 739.99, 880.00, 987.77, 1108.73, 1318.51, 1479.98], // A5, C#5...
                    tempo: 1600
                },
                {
                    name: "Sparkling Lemon",
                    chords: [
                        [196.00, 246.94, 293.66, 369.99], // Gmaj7
                        [261.63, 329.63, 392.00, 493.88], // Cmaj7
                        [246.94, 293.66, 369.99, 440.00], // Bm7
                        [293.66, 329.63, 392.00, 440.00]  // D7
                    ],
                    melodyNotes: [587.33, 659.25, 739.99, 783.99, 880.00, 987.77, 1174.66, 1318.51], // G5, A5...
                    tempo: 1600
                }
            ],
            
            init() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (!this.gainNode) {
                    this.gainNode = audioCtx.createGain();
                    this.filterNode = audioCtx.createBiquadFilter();
                    
                    this.filterNode.type = 'lowpass';
                    this.filterNode.frequency.setValueAtTime(1500, audioCtx.currentTime); // Bright sparkling filter frequency
                    
                    this.gainNode.gain.setValueAtTime(this.volume, audioCtx.currentTime);
                    
                    this.filterNode.connect(this.gainNode);
                    this.gainNode.connect(audioCtx.destination);
                }
            },
            
            start() {
                if (this.isPlaying) return;
                
                this.init();
                this.isPlaying = true;
                this.chordStep = 0;
                
                this.currentTrackIndex = Math.floor(Math.random() * this.tracks.length);
                let track = this.tracks[this.currentTrackIndex];
                showNotification(`🎵 BGM: ${track.name}`);
                
                const playNextMeasure = () => {
                    if (!this.isPlaying) return;
                    if (audioCtx.state === 'suspended') {
                        this.timerId = setTimeout(playNextMeasure, 1000);
                        return;
                    }
                    
                    let track = this.tracks[this.currentTrackIndex];
                    let chord = track.chords[this.chordStep % track.chords.length];
                    
                    chord.forEach((freq) => {
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        
                        osc.connect(gain);
                        gain.connect(this.filterNode);
                        
                        osc.type = 'triangle'; // Smooth base chords
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        
                        let now = audioCtx.currentTime;
                        let duration = track.tempo / 1000;
                        
                        // Bouncy plucky envelope for chords
                        gain.gain.setValueAtTime(0, now);
                        gain.gain.linearRampToValueAtTime(0.04, now + 0.02); // quick pluck attack
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8); // fast decay
                        
                        osc.start(now);
                        osc.stop(now + 0.8);
                    });
                    
                    this.chordStep++;
                    if (this.chordStep >= 8) { // Rotate track after 8 measures for freshness
                        this.chordStep = 0;
                        let prevIndex = this.currentTrackIndex;
                        do {
                            this.currentTrackIndex = Math.floor(Math.random() * this.tracks.length);
                        } while (this.currentTrackIndex === prevIndex && this.tracks.length > 1);
                        
                        let nextTrack = this.tracks[this.currentTrackIndex];
                        setTimeout(() => {
                            showNotification(`🎵 BGM: ${nextTrack.name}`);
                        }, 500);
                    }
                    
                    this.timerId = setTimeout(playNextMeasure, track.tempo);
                };
                
                const playMelody = () => {
                    if (!this.isPlaying) return;
                    if (audioCtx.state === 'suspended') {
                        this.melodyTimerId = setTimeout(playMelody, 1000);
                        return;
                    }
                    
                    let track = this.tracks[this.currentTrackIndex];
                    // Quantized grid-based melody triggers for cute rhythm
                    if (Math.random() < 0.6) {
                        let noteIndex = Math.floor(Math.random() * track.melodyNotes.length);
                        let freq = track.melodyNotes[noteIndex];
                        
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        
                        osc.connect(gain);
                        gain.connect(this.filterNode);
                        
                        osc.type = 'sine'; // pure crystal clear bell pluck
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        
                        let now = audioCtx.currentTime;
                        // Crisp music box sound envelope (instant click, fast decay)
                        gain.gain.setValueAtTime(0, now);
                        gain.gain.linearRampToValueAtTime(0.07, now + 0.005); // plucky attack
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22); // crisp fast release
                        
                        osc.start(now);
                        osc.stop(now + 0.22);
                    }
                    
                    // Rhythmic quantized interval: 200ms (eighth notes at fast tempo)
                    this.melodyTimerId = setTimeout(playMelody, 200);
                };
                
                playNextMeasure();
                playMelody();
            },
            
            stop() {
                this.isPlaying = false;
                if (this.timerId) clearTimeout(this.timerId);
                if (this.melodyTimerId) clearTimeout(this.melodyTimerId);
            }
        };

        function updateBGMVolume() {
            let val = parseFloat(document.getElementById('bgm-volume').value);
            let volume = (val / 100) * 0.08;
            bgmPlayer.volume = volume;
            bgmPlayer.init();
            if (bgmPlayer.gainNode) {
                bgmPlayer.gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
            }
            syncSliderLabels();
        }

        function startGameSession() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.16);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.17);
            } catch (err) {
                console.log("AudioContext start error:", err);
            }
            triggerHaptic(40);
            
            bgmPlayer.start();
            
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Auto-fullscreen blocked:", err);
                });
            }
            
            const splash = document.getElementById('start-splash-screen');
            if (splash) {
                splash.classList.add('fade-out');
                setTimeout(() => { splash.style.display = 'none'; }, 400);
            }

            // Transition from lobby to playground stage!
            setScreenMode('playground');
        }

                    .catch(err => {
                        console.log("Error enabling fullscreen:", err);

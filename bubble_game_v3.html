<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🫧 CSS 3D Dynamic Lens Slime Engine V3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #07080a; color: #fff; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100dvh; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; }

        .game-container { position: relative; width: min(85vw, 85vh); height: min(85vw, 85vh); display: flex; align-items: center; justify-content: center; }

        /* 🎯 캐릭터 이미지는 브라우저 순수 하드웨어 렌더링 (구멍 뚫림 100% 물리적 불가능!) */
        #rabbit-img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: center center;
            will-change: transform, filter;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6));
            pointer-events: auto;
        }

        /* 3D 부풀어 오름 젤리 방울 버블들 */
        .bubble-bulge {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.95), rgba(255, 107, 129, 0.6) 45%, rgba(236, 72, 153, 0.85) 75%, rgba(190, 18, 60, 0.95));
            box-shadow: inset -6px -6px 12px rgba(0,0,0,0.4), 0 10px 25px rgba(236, 72, 153, 0.6), inset 4px 4px 8px rgba(255,255,255,0.8);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            transition: transform 0.06s ease-out;
            z-index: 10;
        }

        /* 터질 때 날아가는 3D 딸기 젤리 파편 */
        .shard {
            position: absolute;
            pointer-events: none;
            border-radius: 4px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.5);
            z-index: 20;
        }

        .info-panel { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.85); color: #ec4899; font-size: 14px; padding: 10px 20px; border-radius: 20px; border: 1px solid rgba(236,72,153,0.3); z-index: 100; pointer-events: none; text-align: center; }
    </style>
</head>
<body>
    <div class="info-panel">✨ 하드웨어 네이티브 렌더링 V3: 뻥 뚫림 100% 완전 원천 소멸 + 리얼 풍선 폭발!</div>
    <div class="game-container" id="container">
        <img id="rabbit-img" src="strawberry_rabbit_jelly.png" alt="Strawberry Rabbit">
    </div>

    <script>
        const container = document.getElementById('container');
        const img = document.getElementById('rabbit-img');

        let isTouching = false;
        let touchX = 0, touchY = 0;
        let activeBubbles = [];
        let animFrame = null;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playInflateTone(progressRatio) {
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();

                osc.type = 'sine';
                let startFreq = 200 + progressRatio * 350;
                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.exponentialRampToValueAtTime(startFreq + 50, now + 0.08);

                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.08);
            } catch (e) {}
        }

        function playLoudBalloonPopSound() {
            if (!audioCtx) return;
            try {
                let now = audioCtx.currentTime;

                let subOsc = audioCtx.createOscillator();
                let subGain = audioCtx.createGain();
                subOsc.type = 'triangle';
                subOsc.frequency.setValueAtTime(170, now);
                subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.22);
                subGain.gain.setValueAtTime(0.70, now);
                subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                subOsc.connect(subGain);
                subGain.connect(audioCtx.destination);
                subOsc.start(now);
                subOsc.stop(now + 0.22);

                let snapOsc = audioCtx.createOscillator();
                let snapGain = audioCtx.createGain();
                snapOsc.type = 'sawtooth';
                snapOsc.frequency.setValueAtTime(920, now);
                snapOsc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
                snapGain.gain.setValueAtTime(0.50, now);
                snapGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                snapOsc.connect(snapGain);
                snapGain.connect(audioCtx.destination);
                snapOsc.start(now);
                snapOsc.stop(now + 0.12);

                let bufferSize = audioCtx.sampleRate * 0.16;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                let noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                let filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.setValueAtTime(800, now);

                let noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.55, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);

                noise.start(now);
            } catch (e) {}
        }

        function triggerHaptic(type) {
            if (navigator.vibrate) {
                if (type === 'inflate') {
                    navigator.vibrate(10);
                } else if (type === 'pop') {
                    navigator.vibrate([40, 50, 80]);
                }
            }
        }

        function createBubbles(cx, cy) {
            activeBubbles.forEach(b => b.el.remove());
            activeBubbles = [];

            const rect = container.getBoundingClientRect();
            const relX = cx - rect.left;
            const relY = cy - rect.top;

            const targetSizes = [75, 55, 38, 25];
            const offsets = [
                {x: 0, y: 0},
                {x: (Math.random()-0.5)*50, y: (Math.random()-0.5)*50},
                {x: (Math.random()-0.5)*80, y: (Math.random()-0.5)*80},
                {x: (Math.random()-0.5)*110, y: (Math.random()-0.5)*110}
            ];

            for (let i = 0; i < 4; i++) {
                const el = document.createElement('div');
                el.className = 'bubble-bulge';
                el.style.width = targetSizes[i] + 'px';
                el.style.height = targetSizes[i] + 'px';
                el.style.left = (relX + offsets[i].x) + 'px';
                el.style.top = (relY + offsets[i].y) + 'px';
                container.appendChild(el);

                activeBubbles.push({
                    el: el,
                    scale: 0,
                    maxScale: 1.0,
                    speed: 0.045 + Math.random() * 0.015,
                    isMain: i === 0,
                    isPopped: false
                });
            }
        }

        function spawnShards(cx, cy) {
            const rect = container.getBoundingClientRect();
            const relX = cx - rect.left;
            const relY = cy - rect.top;

            for (let i = 0; i < 22; i++) {
                const sh = document.createElement('div');
                sh.className = 'shard';
                const w = Math.random() * 16 + 10;
                const h = Math.random() * 20 + 12;
                sh.style.width = w + 'px';
                sh.style.height = h + 'px';
                sh.style.left = relX + 'px';
                sh.style.top = relY + 'px';
                container.appendChild(sh);

                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 14 + 6;
                let vx = Math.cos(angle) * speed;
                let vy = Math.sin(angle) * speed - 4;
                let rot = Math.random() * 360;
                let rotSpd = (Math.random() - 0.5) * 20;
                let opacity = 1.0;

                const anim = () => {
                    vx *= 0.96;
                    vy += 0.45;
                    rot += rotSpd;
                    opacity -= 0.025;

                    const curLeft = parseFloat(sh.style.left) + vx;
                    const curTop = parseFloat(sh.style.top) + vy;
                    sh.style.left = curLeft + 'px';
                    sh.style.top = curTop + 'px';
                    sh.style.transform = `rotate(${rot}deg)`;
                    sh.style.opacity = opacity;

                    if (opacity > 0) {
                        requestAnimationFrame(anim);
                    } else {
                        sh.remove();
                    }
                };
                requestAnimationFrame(anim);
            }
        }

        let soundTimer = 0;

        function updateLoop() {
            if (isTouching) {
                let mainPopped = activeBubbles.some(b => b.isMain && b.isPopped);

                if (!mainPopped) {
                    soundTimer++;
                    activeBubbles.forEach(b => {
                        if (!b.isPopped) {
                            b.scale += b.speed;
                            b.el.style.transform = `translate(-50%, -50%) scale(${b.scale})`;

                            if (soundTimer % 5 === 0) {
                                playInflateTone(b.scale / b.maxScale);
                                triggerHaptic('inflate');
                            }

                            if (b.isMain && b.scale >= b.maxScale) {
                                b.isPopped = true;
                                playLoudBalloonPopSound();
                                triggerHaptic('pop');

                                // 캐릭터 이미지 3D 리바운드 팝 셰이킹
                                img.style.transform = 'scale(1.15) rotate(2deg)';
                                setTimeout(() => { img.style.transform = 'scale(1.0) rotate(0deg)'; }, 150);

                                spawnShards(touchX, touchY);
                                b.el.style.transform = 'translate(-50%, -50%) scale(0)';
                            }
                        }
                    });
                }
            } else {
                activeBubbles.forEach(b => {
                    b.scale += (0 - b.scale) * 0.15;
                    b.el.style.transform = `translate(-50%, -50%) scale(${b.scale})`;
                });
            }
            requestAnimationFrame(updateLoop);
        }

        window.addEventListener('pointerdown', (e) => {
            initAudio();
            isTouching = true;
            touchX = e.clientX;
            touchY = e.clientY;

            // 캐릭터 이미지 볼록 3D 변형
            img.style.transform = 'scale(1.06)';

            createBubbles(touchX, touchY);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isTouching) return;
            touchX = e.clientX;
            touchY = e.clientY;
        });

        const handleRelease = () => {
            isTouching = false;
            img.style.transform = 'scale(1.0)';
        };

        window.addEventListener('pointerup', handleRelease);
        window.addEventListener('pointercancel', handleRelease);

        updateLoop();
    </script>
</body>
</html>
